<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#146c5b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="らくらく勤怠" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>らくらく勤怠</title>
  <style>
    :root { --green:#146c5b; --deep:#0d4037; --cream:#f7f8f4; --line:#dce4df; --ink:#19231f; --muted:#69756f; --orange:#eb8d35; }
    * { box-sizing:border-box; } body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; border:0; }
    .shell { max-width:560px; min-height:100vh; margin:auto; background:#fff; box-shadow:0 0 40px #153d3120; }
    header { padding:20px 22px 22px; color:#fff; background:linear-gradient(135deg,var(--deep),var(--green)); }
    .brand { display:flex; align-items:center; justify-content:space-between; } .brand h1 { font-size:20px; margin:0; letter-spacing:.04em; } .brand button { background:#ffffff20; color:white; padding:8px 11px; border-radius:9px; font-size:13px; }
    .today { margin:25px 0 0; font-size:14px; opacity:.9; } #clock { font-variant-numeric:tabular-nums; font-size:42px; font-weight:700; letter-spacing:.03em; margin-top:3px; }
    main { padding:20px 18px 40px; } .person { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; background:#f1f6f3; border-radius:12px; margin-bottom:21px; }
    .person label { color:var(--muted); font-size:12px; display:block; } .person select { background:transparent; border:0; color:var(--ink); font-weight:700; font-size:17px; max-width:250px; text-align:right; }
    .lead { font-size:14px; color:var(--muted); margin:0 3px 12px; } .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .punch { min-height:112px; padding:14px; text-align:left; border:1px solid var(--line); border-radius:15px; background:#fff; transition:.15s; box-shadow:0 2px 7px #173c3310; }
    .punch:active { transform:scale(.97); } .punch .icon { font-size:27px; display:block; margin-bottom:7px; } .punch strong { display:block; font-size:17px; } .punch small { color:var(--muted); font-size:12px; }
    .punch.start { border-color:#90c8b9; background:#f4fbf8; } .punch.end { border-color:#f2c092; background:#fff9f1; } .punch.end strong { color:#a65014; }
    .notice { min-height:22px; text-align:center; color:var(--green); font-weight:700; font-size:13px; margin:15px 0 6px; }.install { width:100%; margin:8px 0 15px; padding:11px; border-radius:10px; background:#e7f4ef; color:var(--deep); font-weight:700; }
    .site-options { display:grid; gap:8px; margin:10px 0; }.site-option { display:flex; gap:10px; align-items:center; padding:11px; border:1px solid var(--line); border-radius:9px; color:var(--ink); }.site-option input { width:18px; height:18px; }
    h2 { font-size:16px; margin:28px 3px 10px; } .history { border:1px solid var(--line); border-radius:13px; overflow:hidden; } .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px; } .row:last-child { border:0; } .row .time { font-weight:700; font-variant-numeric:tabular-nums; } .tag { padding:4px 8px; font-size:11px; border-radius:99px; background:#e7f4ef; color:var(--green); } .tag.end { background:#fff0df; color:#a65014; }.empty { color:var(--muted); text-align:center; padding:24px; font-size:14px; }.report { width:100%; border-collapse:collapse; font-size:12px; margin:10px 0; }.report th,.report td { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; }.report th { color:var(--muted); font-weight:500; }.record-actions button { margin-left:6px; padding:4px 7px; font-size:11px; border-radius:6px; background:#edf1ef; }.record-actions .remove-record { color:#b43e33; }
    dialog { width:min(92vw,460px); border:0; border-radius:18px; padding:0; box-shadow:0 15px 50px #001b1370; } dialog::backdrop { background:#001b1366; } .modal { padding:22px; } .modal h2 { margin:0 0 16px; font-size:19px; }.field { display:block; margin:13px 0; font-size:13px; color:var(--muted); }.field input { width:100%; padding:11px; border:1px solid var(--line); border-radius:9px; margin-top:5px; color:var(--ink); }.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }.secondary,.primary { padding:10px 14px; border-radius:9px; }.secondary { background:#edf1ef; color:var(--ink); }.primary { background:var(--green); color:#fff; }.admin-list { margin:15px 0; padding:0; list-style:none; }.admin-list li { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }.delete { color:#b43e33; background:none; font-size:13px; }.export { width:100%; margin-top:8px; padding:13px; background:var(--deep); color:white; border-radius:10px; font-weight:700; }.hint { font-size:12px; color:var(--muted); line-height:1.6; }
    /* Mobile-first visual refresh */
    :root { --green:#0f8068; --deep:#073f36; --cream:#edf3f0; --line:#d9e5df; --ink:#16241f; --muted:#68766f; --orange:#e87824; }
    body { background:linear-gradient(145deg,#e7f0ec 0%,#f7f3eb 100%); }
    .shell { position:relative; overflow:hidden; background:#f8faf9; }
    header { position:relative; overflow:hidden; padding:calc(18px + env(safe-area-inset-top)) 20px 34px; background:linear-gradient(145deg,#073f36 0%,#0f8068 68%,#32a085 100%); }
    header::before,header::after { content:""; position:absolute; border-radius:50%; background:#ffffff12; pointer-events:none; }
    header::before { width:190px; height:190px; right:-70px; top:-95px; }
    header::after { width:120px; height:120px; left:-60px; bottom:-70px; }
    .brand { position:relative; z-index:1; gap:12px; }
    .brand-title { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-mark { display:block; flex:0 0 46px; width:46px; height:46px; border:2px solid #ffffff55; border-radius:14px; background:#fff; box-shadow:0 8px 24px #002c2230; object-fit:cover; }
    .brand-copy { min-width:0; }
    .brand h1 { line-height:1.15; font-size:20px; }
    #companyName { display:block; max-width:230px; margin-top:5px; overflow:hidden; color:#d8f3ea; font-size:11px; font-weight:500; letter-spacing:.03em; text-overflow:ellipsis; white-space:nowrap; }
    .brand button { flex:0 0 auto; border:1px solid #ffffff30; background:#ffffff18; font-weight:700; backdrop-filter:blur(8px); }
    .today { position:relative; z-index:1; margin-top:28px; color:#d5eee7; font-size:13px; font-weight:600; }
    #clock { position:relative; z-index:1; margin-top:0; font-size:48px; line-height:1.08; text-shadow:0 3px 18px #002c2230; }
    main { position:relative; z-index:2; margin-top:-16px; padding:0 16px calc(42px + env(safe-area-inset-bottom)); }
    .person { min-height:76px; margin:0 0 23px; padding:14px 16px; border:1px solid #dce9e3; border-radius:18px; background:#fff; box-shadow:0 10px 28px #123d3120; }
    .person label { margin-bottom:4px; color:#789087; font-size:11px; font-weight:700; letter-spacing:.08em; }
    .person select { width:min(62vw,300px); max-width:none; padding:2px 24px 2px 0; outline:none; font-size:19px; text-align:left; }
    .person > span { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:#e8f5f0; color:var(--green); font-size:17px; }
    .lead { margin:0 4px 13px; color:#718078; font-size:13px; font-weight:600; }
    .actions { gap:12px; }
    .punch { position:relative; min-height:128px; overflow:hidden; padding:16px; border:0; border-radius:20px; box-shadow:0 8px 20px #183c3214; }
    .punch::after { content:""; position:absolute; width:74px; height:74px; right:-24px; bottom:-32px; border-radius:50%; background:currentColor; opacity:.06; }
    .punch.start { border:1px solid #bfe3d7; background:linear-gradient(145deg,#fff 0%,#eaf8f3 100%); color:#096a58; }
    .punch.end { border:1px solid #f2d1b5; background:linear-gradient(145deg,#fff 0%,#fff1e4 100%); color:#b85212; }
    .punch .icon { display:grid; place-items:center; width:44px; height:44px; margin-bottom:12px; border-radius:14px; background:#fff; box-shadow:0 5px 14px #143a3015; font-size:25px; }
    .punch strong,.punch.end strong { color:inherit; font-size:19px; }
    .punch small { margin-top:3px; color:#6d7a74; }
    .punch:focus-visible { outline:3px solid #2aa78a; outline-offset:3px; }
    .notice { min-height:0; margin:14px 0 0; border-radius:12px; }
    .notice:not(:empty) { min-height:42px; padding:12px; background:#e7f5ef; box-shadow:inset 0 0 0 1px #cde7dc; }
    h2 { display:flex; align-items:center; gap:8px; margin:27px 3px 11px; font-size:16px; }
    h2::before { content:""; display:block; width:5px; height:18px; border-radius:5px; background:linear-gradient(var(--green),#55b99e); }
    .history { border:1px solid #e0e8e4; border-radius:17px; background:#fff; box-shadow:0 7px 20px #143a300d; }
    .row { min-height:65px; padding:14px 16px; }
    .row .time { font-size:17px; }
    .tag { display:inline-block; min-width:44px; padding:5px 9px; text-align:center; font-weight:700; }
    .install { border:1px solid #cbe5db; border-radius:13px; background:#fff; box-shadow:0 5px 14px #143a300d; }
    .personal-view { width:100%; margin:-10px 0 20px; padding:11px 14px; border:1px solid #cfe1da; border-radius:13px; background:#fff; color:var(--deep); font-weight:700; box-shadow:0 5px 14px #143a300d; }
    .first-pin-note { margin:12px 0; padding:12px 13px; border:1px solid #f0cf9e; border-radius:12px; background:#fff6e8; color:#8a4b12; font-size:13px; font-weight:700; line-height:1.6; }
    .punch.away { border:1px solid #c7dced; background:linear-gradient(145deg,#fff 0%,#edf6fc 100%); color:#24658f; }
    .punch.return { border:1px solid #d9d0ec; background:linear-gradient(145deg,#fff 0%,#f4effb 100%); color:#6e4b98; }
    .loading-screen { position:absolute; z-index:50; inset:0; display:grid; place-items:center; min-height:100vh; padding:24px; background:#073f36ee; color:#fff; text-align:center; backdrop-filter:blur(6px); }
    .loading-screen[hidden] { display:none; }
    .loading-card { width:min(86vw,330px); padding:30px 24px; border:1px solid #ffffff30; border-radius:22px; background:#ffffff16; box-shadow:0 18px 50px #001d1755; }
    .spinner { width:44px; height:44px; margin:0 auto 18px; border:4px solid #ffffff40; border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    .loading-screen.error .spinner { display:none; }
    .loading-screen p { margin:0; font-weight:700; line-height:1.7; }
    #loadingRetry { margin-top:18px; padding:11px 18px; border-radius:12px; background:#fff; color:var(--deep); font-weight:700; }
    @keyframes spin { to { transform:rotate(360deg); } }
    dialog { border-radius:22px; }
    .modal { padding:24px 21px; }
    .primary,.secondary,.export { min-height:44px; border-radius:12px; font-weight:700; }
    @media (min-width:600px) { body { padding:24px 0; } .shell { min-height:calc(100vh - 48px); border-radius:28px; } }
    @media (max-width:370px) { #clock { font-size:43px; } .punch { min-height:116px; padding:13px; } .brand h1 { font-size:18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <div id="loadingScreen" class="loading-screen"><div class="loading-card"><div class="spinner"></div><p id="loadingText">起動中<br>データを読み込んでいます</p><button id="loadingRetry" hidden>もう一度読み込む</button></div></div>
    <header><div class="brand"><div class="brand-title"><img class="brand-mark" src="icon-192.png" alt=""><div class="brand-copy"><h1>らくらく勤怠</h1><span id="companyName">会社名を設定</span></div></div><button id="adminOpen" hidden>管理・集計</button></div><div class="today" id="today"></div><div id="clock">--:--</div></header>
    <main>
      <div class="person"><div><label>打刻する人</label><select id="employee"></select></div><span>⌄</span></div>
      <button class="personal-view" id="personalOpen">自分の1か月分の勤怠を確認</button>
      <p class="lead">打刻する項目を選んでください</p>
      <div class="actions">
        <button class="punch start" data-type="出勤"><span class="icon">☀️</span><strong>出勤</strong><small>会社へ出勤</small></button>
        <button class="punch start" data-type="直行"><span class="icon">🚃</span><strong>直行</strong><small>現場へ直接向かう</small></button>
        <button class="punch end" data-type="退勤"><span class="icon">🌙</span><strong>退勤</strong><small>勤務終了</small></button>
        <button class="punch end" data-type="直帰"><span class="icon">🏠</span><strong>直帰</strong><small>現場から直接帰る</small></button>
        <button class="punch away" data-type="外出"><span class="icon">🚪</span><strong>外出</strong><small>勤務途中で一時退出</small></button>
        <button class="punch return" data-type="戻り"><span class="icon">↩️</span><strong>戻り</strong><small>外出から勤務へ戻る</small></button>
      </div>
      <div class="notice" id="notice"></div>
      <button class="install" id="install" hidden>📲 このアプリをホーム画面に追加</button>
      <h2>今日の記録</h2><div class="history" id="history"></div>
    </main>
  </div>
  <dialog id="adminDialog"><div class="modal" id="adminContent"></div></dialog>
  <dialog id="siteDialog"><div class="modal" id="siteContent"></div></dialog>
  <dialog id="personalDialog"><div class="modal" id="personalContent"></div></dialog>
  <script src="app-config.js"></script>
  <script>
    const SELECTED_EMPLOYEE_KEY='rakuraku-kintai-selected-employee';
    const initial={ employees:['山田 太郎'], sites:[], holidays:[], records:[], pinStatus:[], pinConfiguredNames:[], pin:'1234', companyName:'会社名を設定', admins:[], closingDay:20, overtimeStart:'18:00' };
    let data={...initial,employees:[...initial.employees],sites:[],holidays:[],records:[],pinStatus:[],pinConfiguredNames:[],admins:[]};
    data.sites ||= [];
    data.holidays ||= [];
    data.admins ||= [];
    data.pinStatus ||= [];
    data.pinConfiguredNames ||= [];
    data.closingDay ||= 20;
    data.overtimeStart ||= '18:00';
    const API=window.KINTAI_API_URL||'';
    let adminPin=data.pin;
    const $=s=>document.querySelector(s), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'), jpDate=d=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d), keyDate=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d);
    function save(){}
    function callShared(payload){return new Promise(resolve=>{if(!API)return resolve({ok:true});if(adminPin)payload.adminName=$('#employee').value;const callback='kintaiWrite_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();resolve(result);};script.src=`${API}?payload=${encodeURIComponent(JSON.stringify(payload))}&callback=${callback}`;script.onerror=()=>{delete window[callback];script.remove();resolve({ok:false,error:'通信を確認してください'});};document.head.appendChild(script);});}
    function postShared(payload){callShared(payload).then(result=>{if(!result.ok){$('#notice').textContent=`共有保存に失敗しました：${result.error||'設定を確認してください'}`;loadShared();}});}
    function setLoading(active,message='起動中\nデータを読み込んでいます',error=false){const screen=$('#loadingScreen');screen.hidden=!active;screen.classList.toggle('error',error);$('#loadingText').innerHTML=esc(message).replaceAll('\n','<br>');$('#loadingRetry').hidden=!error;document.querySelectorAll('.punch,#employee,#adminOpen,#personalOpen').forEach(element=>element.disabled=active);}
    function verifyAdmin(pin){const callback='kintaiAdmin_'+Date.now(),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();if(result.ok){adminPin=pin;data={...data,...(result.data||{})};save();admin();}else alert('管理者名または暗証番号が違います');};script.src=`${API}?action=verifyAdmin&name=${encodeURIComponent($('#employee').value)}&pin=${encodeURIComponent(pin)}&callback=${callback}`;script.onerror=()=>alert('管理者確認に失敗しました');document.head.appendChild(script);}
    function loadShared(){setLoading(true);if(!API){setLoading(false);$('#notice').textContent='起動しました';return;}const callback='kintaiData_'+Date.now();window[callback]=payload=>{delete window[callback];script.remove();if(payload.ok){data={...data,...payload.data};save();render();setLoading(false);$('#notice').textContent='起動しました';setTimeout(()=>$('#notice').textContent='',2500);}else setLoading(true,payload.error||'データを読み込めません',true);};const script=document.createElement('script');script.src=`${API}?action=bootstrap&callback=${callback}`;script.onerror=()=>{delete window[callback];script.remove();setLoading(true,'データを読み込めません\n通信を確認してください',true);};document.head.appendChild(script);}
    function render(){ const sel=$('#employee'), current=sel.value||localStorage.getItem(SELECTED_EMPLOYEE_KEY); sel.innerHTML=data.employees.map(n=>`<option>${n}</option>`).join(''); if(data.employees.includes(current))sel.value=current; localStorage.setItem(SELECTED_EMPLOYEE_KEY,sel.value); $('#companyName').textContent=data.companyName||'会社名を設定';$('#adminOpen').hidden=!data.admins.includes(sel.value);const who=sel.value, today=keyDate(new Date()); const rows=data.records.filter(r=>r.name===who&&r.date===today).sort((a,b)=>b.at-a.at); $('#history').innerHTML=rows.length?rows.map(r=>`<div class="row"><div><span class="tag ${['退勤','直帰'].includes(r.type)?'end':''}">${r.type}</span>${r.expectedReturn?`<div class="hint">戻り予定：${esc(r.expectedReturn)}</div>`:''}${r.sites?.length?`<div class="hint">現場：${r.sites.join('、')}</div>`:''}</div><div class="time">${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty">まだ打刻はありません</div>'; }
    function tick(){const d=new Date();$('#today').textContent=jpDate(d);$('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});} tick();setInterval(tick,1000);render();loadShared();
    $('#employee').addEventListener('change',()=>{localStorage.setItem(SELECTED_EMPLOYEE_KEY,$('#employee').value);render();});
    document.querySelectorAll('.punch').forEach(b=>b.addEventListener('click',()=>authorizePunch(b.dataset.type)));
    function authorizePunch(type){const time=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});if(!confirm(`${type}を ${time} に打刻しますか？`))return;let expectedReturn='';if(type==='外出'){expectedReturn=prompt('戻る予定時刻を数字4桁または HH:MM で入力してください（例：1530）','');if(expectedReturn===null)return;expectedReturn=expectedReturn.trim().replace(/^(\d{2})(\d{2})$/,'$1:$2');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(expectedReturn))return alert('戻る予定時刻を正しく入力してください');}const after=['出勤','直行'].includes(type)?()=>chooseSites(type):['退勤','直帰'].includes(type)?()=>{if(confirm('追加の現場がありますか？\n\nある場合は「OK」、ない場合は「キャンセル」を押してください。'))chooseSites(type);}:null;return recordPunch(type,[],after,expectedReturn);}
    function chooseSites(type,selected=[]){const dialog=$('#siteDialog');dialog.showModal();$('#siteContent').innerHTML=`<h2>現場を選択</h2><p class="hint">現場は複数選択できます。打刻時刻はすでに記録されています。</p><div class="site-options">${data.sites.map(s=>`<label class="site-option"><input type="checkbox" value="${esc(s)}" ${selected.includes(s)?'checked':''}>${esc(s)}</label>`).join('')||'<p class="hint">登録済みの現場はありません。</p>'}</div><button class="secondary" id="siteQuickAdd">＋ 現場を追加</button><div class="modal-actions"><button class="secondary" onclick="siteDialog.close()">あとで選ぶ</button><button class="primary" id="siteConfirm">現場を保存</button></div>`;$('#siteQuickAdd').onclick=()=>{const name=prompt('追加する現場名を入力してください');if(!name?.trim())return;const n=name.trim();if(data.sites.includes(n))return alert('同じ現場名が登録されています');const checked=[...document.querySelectorAll('#siteContent input:checked')].map(x=>x.value);data.sites.push(n);save();postShared({action:'addSiteByStaff',name:n,staff:$('#employee').value});chooseSites(type,[...checked,n]);};$('#siteConfirm').onclick=()=>{const sites=[...document.querySelectorAll('#siteContent input:checked')].map(x=>x.value);dialog.close();saveSites(type,sites);};}
    function recordPunch(type,sites,after,expectedReturn=''){const now=new Date(),name=$('#employee').value,date=keyDate(now),today=data.records.filter(r=>r.name===name&&r.date===date);if(['出勤','直行'].includes(type)){const existing=today.find(r=>['出勤','直行'].includes(r.type));if(existing)return void($('#notice').textContent=`今日はすでに「${existing.type}」を記録済みです`);}if(['退勤','直帰'].includes(type)){const existing=today.find(r=>['退勤','直帰'].includes(r.type));if(existing)return void($('#notice').textContent=`今日はすでに「${existing.type}」を記録済みです`);}const away=today.filter(r=>r.type==='外出').length,back=today.filter(r=>r.type==='戻り').length;if(type==='外出'&&away>back)return alert('先に「戻り」を記録してください');if(type==='戻り'&&away<=back)return alert('先に「外出」を記録してください');const record={name,type,date,at:now.getTime(),sites,expectedReturn,earlyLeaveMinutes:earlyLeaveMinutesClient(type,now.getTime(),date)};data.records.push(record);save();postShared({action:'punch',...record});render();$('#notice').textContent=`${type}を ${now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} に記録しました${record.earlyLeaveMinutes?`（早退 ${minutesLabel(record.earlyLeaveMinutes)}）`:''}`;setTimeout(()=>$('#notice').textContent='',3500);if(after)after();}

    function renderOutingReport(records){const target=$('#outingReport');if(!target)return;const rows=[...records].filter(record=>['外出','戻り'].includes(record.type)).sort((a,b)=>a.at-b.at),sessions=[],open={};rows.forEach(record=>{const key=`${record.name}|${record.date}`;if(record.type==='外出'){open[key]=record;sessions.push({start:record,end:null});}else if(open[key]){const session=[...sessions].reverse().find(item=>item.start===open[key]);if(session)session.end=record;delete open[key];}});target.innerHTML=sessions.length?sessions.reverse().map(session=>`<div class="row"><div><b>${esc(session.start.name)}</b><div class="hint">${session.start.date}・戻り予定 ${esc(session.start.expectedReturn||'未入力')}</div></div><div class="time">${new Date(session.start.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}${session.end?`〜${new Date(session.end.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}<div class="hint">${minutesLabel(Math.round((session.end.at-session.start.at)/60000))}</div>`:'<div class="hint">外出中</div>'}</div></div>`).join(''):'<div class="empty">中抜けの記録はありません</div>';}
    const baseRenderReport=renderReport;renderReport=function(){baseRenderReport();const month=$('#month')?.value;if(month){const period=closingPeriod(month);renderOutingReport(data.records.filter(record=>record.date>=period.start&&record.date<=period.end));}};
    const baseAdmin=admin;admin=function(){baseAdmin();const anchor=$('#export');if(anchor){anchor.insertAdjacentHTML('beforebegin',`<h2>中抜け連絡一覧</h2><div id="outingReport" class="history"></div><h2>個人PIN管理</h2><p class="hint">PINの内容は表示されません。本人が忘れた場合だけリセットしてください。</p><ul class="admin-list" id="pinStatusList">${data.employees.map(name=>{const configured=data.pinStatus.find(item=>item.name===name)?.configured;return `<li><span>${esc(name)} <small class="hint">${configured?'設定済み':'未設定'}</small></span>${configured?`<button class="delete reset-personal-pin" data-name="${esc(name)}">リセット</button>`:''}</li>`;}).join('')}</ul>`);document.querySelectorAll('.reset-personal-pin').forEach(button=>button.onclick=async()=>{const name=button.dataset.name;if(!confirm(`${name}さんの個人PINを未設定に戻しますか？`))return;const result=await callShared({action:'resetPersonalPin',name,pin:adminPin});if(!result.ok)return alert(result.error||'PINをリセットできません');const item=data.pinStatus.find(value=>value.name===name);if(item)item.configured=false;else data.pinStatus.push({name,configured:false});data.pinConfiguredNames=data.pinConfiguredNames.filter(value=>value!==name);save();admin();});}renderReport();};
    let installEvent;const install=$('#install');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;install.hidden=false;});install.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;install.hidden=true;installEvent=null;});window.addEventListener('appinstalled',()=>{install.hidden=true;});if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
  </script>
