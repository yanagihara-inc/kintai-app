    h2 { font-size:16px; margin:28px 3px 10px; } .history { border:1px solid var(--line); border-radius:13px; overflow:hidden; } .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px; } .row:last-child { border:0; } .row .time { font-weight:700; font-variant-numeric:tabular-nums; } .tag { padding:4px 8px; font-size:11px; border-radius:99px; background:#e7f4ef; color:var(--green); } .tag.end { background:#fff0df; color:#a65014; }.empty { color:var(--muted); text-align:center; padding:24px; font-size:14px; }.report { width:100%; border-collapse:collapse; font-size:12px; margin:10px 0; }.report th,.report td { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; }.report th { color:var(--muted); font-weight:500; }.record-actions button { margin-left:6px; padding:4px 7px; font-size:11px; border-radius:6px; background:#edf1ef; }.record-actions .remove-record { color:#b43e33; }

    .who-table { width:100%; border-collapse:collapse; font-size:13px; }.who-table th,.who-table td { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; }.who-table th { color:var(--muted); font-size:11px; }
    @keyframes buttonPress { 0%{transform:translateY(0) scale(1);filter:brightness(1);box-shadow:0 0 0 0 #2fbd9680} 28%{transform:translateY(-9px) scale(1.07);filter:brightness(1.12);box-shadow:0 0 0 7px #2fbd9638} 52%{transform:translateY(2px) scale(.98);filter:brightness(.98);box-shadow:0 0 0 13px #2fbd9600} 72%{transform:translateY(-4px) scale(1.03)} 88%{transform:translateY(1px) scale(.995)} 100%{transform:translateY(0) scale(1);filter:brightness(1);box-shadow:0 0 0 0 #2fbd9600} }
    button.press-animate { animation:buttonPress .68s cubic-bezier(.2,.8,.25,1); }
    .button-runner { position:absolute; z-index:4; left:-28px; bottom:8px; display:block; font-size:21px; line-height:1; pointer-events:none; filter:drop-shadow(0 2px 2px #0003); animation:runnerDash 1.6s linear forwards; }
    .button-runner.reverse { left:calc(100% + 8px); animation-name:runnerDashReverse; }
    .button-runner.giant { bottom:2px; font-size:46px; filter:drop-shadow(0 4px 4px #0005); }
    .runner-character { display:block; transform-origin:50% 100%; animation:animalRun .22s steps(2,end) infinite; }
    .runner-character.dog { filter:sepia(.85) saturate(2) brightness(.78) contrast(1.15); }
    .runner-character.cat { filter:grayscale(1) brightness(.95) contrast(1.1); }
    .runner-character.rabbit { filter:sepia(1) saturate(2) hue-rotate(285deg); }
    .runner-character.squirrel { filter:sepia(.25) saturate(1.1) brightness(1.1); }
    .runner-character.rabbit { animation:animalHop .52s cubic-bezier(.3,.05,.55,1) infinite; }
    .runner-character.squirrel { animation:animalBound .36s ease-in-out infinite; }
    .runner-facing { display:block; transform-origin:center; }
    .button-runner.fox { bottom:7px; width:29px; height:20px; }

    .button-runner.fox.giant { bottom:1px; width:64px; height:44px; }
    @keyframes runnerDash { 0%{left:-28px;transform:translateY(0) rotate(-7deg)} 18%{transform:translateY(-5px) rotate(5deg)} 36%{transform:translateY(0) rotate(-7deg)} 54%{transform:translateY(-5px) rotate(5deg)} 72%{transform:translateY(0) rotate(-7deg)} 90%{transform:translateY(-5px) rotate(5deg)} 100%{left:calc(100% + 8px);transform:translateY(0) rotate(-7deg)} }
    @keyframes runnerDashReverse { 0%{left:calc(100% + 8px);transform:translateY(0) rotate(-7deg)} 18%{transform:translateY(-5px) rotate(5deg)} 36%{transform:translateY(0) rotate(-7deg)} 54%{transform:translateY(-5px) rotate(5deg)} 72%{transform:translateY(0) rotate(-7deg)} 90%{transform:translateY(-5px) rotate(5deg)} 100%{left:-28px;transform:translateY(0) rotate(-7deg)} }
    @keyframes animalRun { 0%{transform:translateY(2px) rotate(-7deg) scaleX(1.08) scaleY(.9)} 50%{transform:translateY(-5px) rotate(7deg) scaleX(.94) scaleY(1.09)} 100%{transform:translateY(2px) rotate(-7deg) scaleX(1.08) scaleY(.9)} }

    let storedConfig=null;try{storedConfig=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null');}catch(_){storedConfig=null;}

    function save(){}
    function saveConfig(){const keys=['employees','sites','holidays','pinConfiguredNames','companyName','admins','closingDay','overtimeStart'],settings={};keys.forEach(key=>settings[key]=data[key]);localStorage.setItem(CONFIG_KEY,JSON.stringify({version:configVersion,data:settings}));}
    function callShared(payload){return new Promise(resolve=>{if(!API)return resolve({ok:true});payload={...payload};if(adminPin)payload.adminName=$('#employee').value;const callback='kintaiWrite_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();resolve(result);};script.src=`${API}?payload=${encodeURIComponent(JSON.stringify(payload))}&callback=${callback}`;script.onerror=()=>{delete window[callback];script.remove();resolve({ok:false,error:'通信を確認してください',networkError:true});};document.head.appendChild(script);});}
    function readPendingQueue(){try{const value=JSON.parse(localStorage.getItem(PENDING_QUEUE_KEY)||'[]');return Array.isArray(value)?value:[];}catch(_){return [];}}

    async function postShared(payload){const result=await callShared(payload);if(result.ok){if(payload.action==='punch'&&result.id){const record=data.records.find(item=>item.name===payload.name&&item.date===payload.date&&item.type===payload.type&&item.at===payload.at);if(record)record.id=result.id;}return true;}if(result.networkError&&['punch','updateRecordSites'].includes(payload.action)){queueShared(payload);$('#notice').textContent='通信できないため端末に保存しました。通信回復後に自動送信します。';renderMissingPunchWarning();return false;}if(payload.action==='punch'&&String(result.error||'').includes('端末')){localStorage.removeItem(DEVICE_REGISTRATION_KEY);data.records=data.records.filter(record=>!(record.name===payload.name&&record.date===payload.date&&record.type===payload.type&&record.at===payload.at));render();}$('#notice').textContent=`共有保存に失敗しました：${result.error||'設定を確認してください'}`;return false;}

    function setLoading(active,message='起動中\nデータを読み込んでいます',error=false){const screen=$('#loadingScreen');screen.hidden=!active;screen.classList.toggle('error',error);$('#loadingText').innerHTML=esc(message).replaceAll('\n','<br>');$('#loadingRetry').hidden=!error;document.querySelectorAll('.punch,#employee,#adminOpen,#personalOpen,#holidayOpen,#whoOpen,#gamesOpen,#correctionOpen,#nightCount,#tripCount,#animalPreviewOpen,#correctionReviewOpen').forEach(element=>element.disabled=active);if(!active){updateSupplementButtons();updatePunchButtons();}}
    function verifyAdmin(pin,onVerified=admin){const callback='kintaiAdmin_'+Date.now(),script=document.createElement('script');window[callback]=result=>{delete window[callback];script.remove();if(result.ok){adminPin=pin;data={...data,...(result.data||{})};save();onVerified();}else alert('管理者名または暗証番号が違います');};script.src=`${API}?action=verifyAdmin&name=${encodeURIComponent($('#employee').value)}&pin=${encodeURIComponent(pin)}&callback=${callback}`;script.onerror=()=>alert('管理者確認に失敗しました');document.head.appendChild(script);}
    function loadShared(){setLoading(true);if(!API){setLoading(false);$('#notice').textContent='起動しました';return;}const callback='kintaiData_'+Date.now();let timer;const cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove();};window[callback]=payload=>{cleanup();if(payload.ok){try{data={...data,...payload.data};const pendingPunches=readPendingQueue().filter(item=>item.payload.action==='punch').map(item=>item.payload),known=new Set(data.records.map(record=>`${record.name}|${record.date}|${record.type}|${record.at}`));pendingPunches.forEach(record=>{const key=`${record.name}|${record.date}|${record.type}|${record.at}`;if(!known.has(key))data.records.push({...record,pending:true});});configVersion=String(payload.data.configVersion||configVersion);if(payload.data.configChanged)saveConfig();render();setLoading(false);$('#notice').textContent=readPendingQueue().length?'送信待ちの打刻があります。通信回復後に自動送信します。':payload.data.configChanged?'設定と当日の打刻を更新しました':'当日の打刻を更新しました';flushPendingQueue();setTimeout(()=>{if(!readPendingQueue().length)$('#notice').textContent='';},2500);}catch(error){setLoading(true,'起動データを処理できません\nもう一度読み込むを押してください',true);}}else setLoading(true,payload.error||'データを読み込めません',true);};const script=document.createElement('script');script.src=`${API}?action=bootstrap&configVersion=${encodeURIComponent(configVersion)}&callback=${callback}`;script.onerror=()=>{cleanup();setLoading(true,'データを読み込めません\n通信を確認してください',true);};timer=setTimeout(()=>{cleanup();setLoading(true,'サーバーから応答がありません\n通信状態とApps Scriptの公開設定を確認してください',true);},25000);document.head.appendChild(script);}
    function readDeviceRegistration(){try{const value=JSON.parse(localStorage.getItem(DEVICE_REGISTRATION_KEY)||'null');return value&&value.name&&value.deviceToken?value:null;}catch(_){return null;}}
    function canUseDesktopAdmin(){return !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)&&data.admins.includes($('#employee').value);}
function render(){ const sel=$('#employee'),registration=readDeviceRegistration(),available=registration&&data.employees.includes(registration.name)?[registration.name]:data.employees,current=registration?.name||sel.value||localStorage.getItem(SELECTED_EMPLOYEE_KEY);sel.innerHTML=available.map(n=>`<option>${n}</option>`).join('');if(available.includes(current))sel.value=current;sel.disabled=!!registration;localStorage.setItem(SELECTED_EMPLOYEE_KEY,sel.value);$('#companyName').textContent=data.companyName||'会社名を設定';const isAdmin=data.admins.includes(sel.value);$('#adminOpen').hidden=!canUseDesktopAdmin();$('#animalPreviewOpen').hidden=!isAdmin;$('#adminBadge').hidden=!isAdmin;updateCorrectionReviewButton();const who=sel.value,today=keyDate(new Date());const rows=data.records.filter(r=>r.name===who&&r.date===today).sort((a,b)=>b.at-a.at),todaySites=[...new Set(rows.flatMap(r=>r.sites||[]).filter(Boolean))];$('#todaySites').innerHTML=todaySites.length?todaySites.map(site=>`<span class="today-site-name">${esc(site)}</span>`).join(''):'未選択';$('#history').innerHTML=rows.length?rows.map(r=>`<div class="row"><div><span class="tag ${['退勤','直帰'].includes(r.type)?'end':''}">${r.type}</span>${r.expectedReturn?`<div class="hint">戻り予定：${esc(r.expectedReturn)}</div>`:''}</div><div class="time">${new Date(r.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty">まだ打刻はありません</div>';}
    function updateSupplementButtons(){const name=$('#employee').value,date=keyDate(new Date());[['#nightCount','夜勤','🌙'],['#tripCount','出張','🧳']].forEach(([selector,type,icon])=>{const button=$(selector),recorded=data.records.some(record=>record.name===name&&record.date===date&&record.type===type);button.disabled=false;button.textContent=recorded?`${icon} ${type}：記録済み`:`${icon} ${type}を記録`;button.classList.toggle('recorded',recorded);});}
    function updatePunchButtons(){const name=$('#employee').value,date=keyDate(new Date()),rows=data.records.filter(record=>record.name===name&&record.date===date),start=rows.find(record=>['出勤','直行'].includes(record.type)),end=rows.find(record=>['退勤','直帰'].includes(record.type)),awayCount=rows.filter(record=>record.type==='外出').length,returnCount=rows.filter(record=>record.type==='戻り').length,awayOpen=awayCount>returnCount,descriptions={出勤:'会社へ出勤',直行:'現場へ直接向かう',退勤:'勤務終了',直帰:'現場から直接帰る',外出:'勤務途中で一時退出',戻り:'外出から勤務へ戻る'};document.querySelectorAll('.punch').forEach(button=>{const type=button.dataset.type,strong=button.querySelector('strong'),small=button.querySelector('small'),recorded=(start?.type===type)||(end?.type===type);button.classList.toggle('recorded',recorded);strong.textContent=recorded?`${type}（打刻済み）`:type;small.textContent=descriptions[type]||'';if(['出勤','直行'].includes(type))button.disabled=!!start&&!recorded;else if(['退勤','直帰'].includes(type))button.disabled=(!!end&&!recorded)||!start;else if(type==='外出')button.disabled=!!end||!start||awayOpen;else if(type==='戻り')button.disabled=!!end||!awayOpen;});}
    function renderMissingPunchWarning(){const target=$('#missingAlert'),name=$('#employee').value,today=keyDate(new Date()),rows=data.records.filter(record=>record.name===name&&record.date===today),messages=data.missingPunches.filter(item=>item.name===name).map(item=>`${item.date}：${item.message}`),start=rows.some(record=>['出勤','直行'].includes(record.type)),end=rows.some(record=>['退勤','直帰'].includes(record.type)),away=rows.filter(record=>record.type==='外出').length,back=rows.filter(record=>record.type==='戻り').length;if(start&&!end&&new Date().getHours()>=18)messages.unshift('本日の退勤・直帰がまだ記録されていません');if(away>back)messages.unshift('外出後の「戻り」がまだ記録されていません');const pending=readPendingQueue().length;if(pending)messages.unshift(`通信待ちの記録が${pending}件あります`);target.hidden=!messages.length;target.innerHTML=messages.length?`⚠️ ${messages.map(esc).join('<br>')}`:'';}
    const baseRenderWithNightCount=render;render=function(){baseRenderWithNightCount();updateSupplementButtons();updatePunchButtons();renderMissingPunchWarning();};
    function tick(){const d=new Date();$('#today').textContent=jpDate(d);$('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});if(d.getSeconds()===0)renderMissingPunchWarning();} tick();setInterval(tick,1000);render();loadShared();
    $('#employee').addEventListener('change',()=>{localStorage.setItem(SELECTED_EMPLOYEE_KEY,$('#employee').value);render();});
    $('#holidayOpen').addEventListener('click',()=>{const month=keyDate(new Date()).slice(0,7);$('#holidayMonth').value=month;renderHolidayCalendar(month);$('#holidayDialog').showModal();});
    function renderWhoWhere(){const today=keyDate(new Date()),rows=data.records.filter(record=>record.date===today),body=data.employees.map(name=>{const personal=rows.filter(record=>record.name===name).sort((a,b)=>a.at-b.at),start=personal.some(record=>['出勤','直行'].includes(record.type)),end=personal.some(record=>['退勤','直帰'].includes(record.type)),status=end?'退勤済み':start?'出勤中':'未出勤',sites=[...new Set(personal.flatMap(record=>record.sites||[]).filter(Boolean))];return `<tr><td>${esc(name)}</td><td>${status}</td><td>${sites.length?sites.map(esc).join('、'):'—'}</td></tr>`;}).join('');$('#whoContent').innerHTML=`<table class="who-table"><thead><tr><th>氏名</th><th>出勤状況</th><th>行先</th></tr></thead><tbody>${body}</tbody></table>`;$('#whoDialog').showModal();}
    $('#whoOpen').addEventListener('click',()=>{if(!API)return renderWhoWhere();const button=$('#whoOpen');button.disabled=true;const callback='kintaiWho_'+Date.now(),script=document.createElement('script');window[callback]=payload=>{delete window[callback];script.remove();button.disabled=false;if(payload.ok){data={...data,...payload.data};render();renderWhoWhere();}else alert(payload.error||'誰どこを更新できません');};script.src=`${API}?action=bootstrap&configVersion=${encodeURIComponent(configVersion)}&callback=${callback}`;script.onerror=()=>{delete window[callback];script.remove();button.disabled=false;alert('誰どこを更新できません。通信を確認してください。');};document.head.appendChild(script);});

    async function verifyPunchIdentity(){const name=$('#employee').value,registration=readDeviceRegistration();if(registration?.name===name)return true;if(!data.pinConfiguredNames.includes(name)){alert(`${name}さんの個人PINが未設定です。\n先に「今月の勤怠記録」から数字3桁のPINを登録してください。`);return false;}const pin=prompt(`${name}さんの個人PIN（数字3桁）を入力してください\n※初回だけ、このスマホを本人端末として登録します`,'');if(pin===null)return false;if(!/^\d{3}$/.test(pin)){alert('個人PINを数字3桁で入力してください');return false;}const result=await callShared({action:'registerDevice',name,personalPin:pin});if(!result.ok){alert(result.error||'端末登録に失敗しました');return false;}localStorage.setItem(DEVICE_REGISTRATION_KEY,JSON.stringify({name:result.name,deviceToken:result.deviceToken}));$('#notice').textContent=`${name}さんの本人端末として登録しました。次回からPIN入力は不要です。`;render();return true;}
    const showButtonMotion=()=>new Promise(resolve=>setTimeout(resolve,220));

    $('#tripCount').addEventListener('click',async event=>{if(event.currentTarget.classList.contains('recorded'))return void($('#notice').textContent='出張は本日記録済みです');await showButtonMotion();if(!await verifyPunchIdentity())return;const now=new Date();if(!confirm(`出張1回を ${now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} に記録しますか？`))return;recordPunch('出張',[],null,'',keyDate(now),now);});
    function updateCorrectionReviewButton(){const count=Number(data.pendingCorrectionCount??(data.correctionRequests||[]).length),button=$('#correctionReviewOpen');button.hidden=!data.admins.includes($('#employee').value)||count<1;button.textContent=`打刻修正依頼（${count}件）`;}
    function correctionTime(at){return new Date(at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});}
    function showTodayCorrectionForm(records,name,auth={}){
      const today=keyDate(new Date()),eligible=records.filter(record=>record.id&&record.date===today);
      if(!eligible.length)return alert('本日の修正可能な打刻はありません。\n当日以外は管理者へ報告してください。');

      $('#personalContent').innerHTML=`<h2>本日の打刻修正申請</h2><p class="hint">${esc(today)} の打刻です。時刻だけを選んでください。日付と打刻種別は変更しません。</p><label class="field">修正する打刻<select id="todayCorrectionRecord" style="width:100%;padding:12px;border-radius:9px">${[...eligible].sort((a,b)=>b.at-a.at).map(record=>`<option value="${esc(record.id)}">${esc(record.type)} ${correctionTime(record.at)}</option>`).join('')}</select></label><label class="field">修正後の時刻<input class="correction-time" id="todayCorrectionTime" type="time" step="60" required></label><div class="modal-actions"><button class="secondary" id="todayCorrectionClose">閉じる</button><button class="primary" id="todayCorrectionSubmit">修正申請を送信</button></div>`;
      const select=$('#todayCorrectionRecord'),time=$('#todayCorrectionTime'),selected=()=>eligible.find(record=>record.id===select.value);
      select.onchange=()=>{time.value=correctionTime(selected().at);};select.onchange();
      $('#todayCorrectionClose').onclick=()=>dialog.close();
      $('#todayCorrectionSubmit').onclick=async()=>{
        const record=selected(),value=time.value;

    const adminWithCorrections=admin;admin=function(){adminWithCorrections();const anchor=$('#export');if(!anchor)return;const requests=data.correctionRequests||[];anchor.insertAdjacentHTML('beforebegin',`<h2>打刻修正申請</h2><div class="history">${requests.length?requests.map(request=>`<div class="row"><div><b>${esc(request.name)}</b><div class="hint">${request.beforeDate} ${esc(request.beforeType)} ${new Date(request.beforeAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}<br>→ ${request.afterDate} ${esc(request.afterType)} ${new Date(request.afterAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="record-actions"><button class="approve-correction" data-id="${esc(request.id)}">承認</button><button class="remove-record reject-correction" data-id="${esc(request.id)}">却下</button></div></div>`).join(''):'<div class="empty">申請中の修正はありません</div>'}</div>`);document.querySelectorAll('.approve-correction,.reject-correction').forEach(button=>button.onclick=async()=>{const decision=button.classList.contains('approve-correction')?'承認':'却下';if(!confirm(`この修正申請を${decision}しますか？`))return;button.disabled=true;const result=await callShared({action:'reviewCorrectionRequest',requestId:button.dataset.id,decision,pin:adminPin});if(!result.ok){button.disabled=false;return alert(result.error||`${decision}できません`);}alert(`修正申請を${decision}しました`);verifyAdmin(adminPin);});};
    document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;button.classList.remove('press-animate');void button.offsetWidth;button.classList.add('press-animate');},{capture:true,passive:true});
    window.addEventListener('online',()=>flushPendingQueue());
    let installEvent;const install=$('#install');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;install.hidden=false;});install.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;install.hidden=true;installEvent=null;});window.addEventListener('appinstalled',()=>{install.hidden=true;});if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
  </script>
