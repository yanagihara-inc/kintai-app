<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クレーン積み上げ</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf1f6;color:#203b50;font-family:system-ui}main{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}button,a{font:inherit;background:#286b92;color:white;border:0;border-radius:10px;padding:12px;text-decoration:none;touch-action:manipulation}canvas{width:100%;flex:1;min-height:0;border-radius:14px;touch-action:manipulation}#drop{font-weight:bold;font-size:20px}p{margin:0;text-align:center;font-size:14px}dialog{max-width:90vw;border:0;border-radius:18px;padding:24px}dialog::backdrop{background:#102a44aa}dialog button{margin-top:14px;width:100%}</style><main><header><h1>クレーン積み上げ</h1><a href="./index.html" onclick="return back()">一覧</a></header><p id="status">高さ 0段 ・ レベル 1</p><canvas id="scene" aria-label="クレーンの荷物を積む現場"></canvas><button id="drop">荷物を落とす</button><p>重なる位置でタップ！ はみ出した部分は落ちます。</p></main><dialog id="panel"><h2 id="title">クレーン積み上げ</h2><p id="message">揺れる荷物を落として高く積もう。積むほどクレーンが速くなります。</p><button id="start">スタート</button><button onclick="back()">ゲーム一覧</button></dialog><script>
'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),panel=document.getElementById('panel'),drop=document.getElementById('drop');let mode='ready',stack=[],cargo=null,debris=[],height=0,phase=0,last=0,offset=0;const W=400,H=600,blockH=32;canvas.width=W;canvas.height=H;
function newCargo(){cargo={x:80,y:90,w:stack.at(-1).w};phase=-Math.PI/2}
function start(){stack=[{x:85,y:540,w:230}];height=0;debris=[];offset=0;mode='moving';newCargo();last=performance.now();drop.disabled=false;panel.close();update()}
function update(){status.textContent='高さ '+height+'段 ・ レベル '+(1+Math.floor(height/3))}
function release(){if(mode!=='moving')return;mode='falling';cargo.v=0;drop.disabled=true}
function finish(){mode='over';document.getElementById('title').textContent='作業終了';document.getElementById('message').textContent='積み上げた高さ：'+height+'段';document.getElementById('start').textContent='もう一度遊ぶ';panel.showModal();if(parent!==window)parent.postMessage({type:'crane-result',score:height},'*')}
function land(){const top=stack.at(-1),left=Math.max(cargo.x,top.x),right=Math.min(cargo.x+cargo.w,top.x+top.w);if(right-left<8){debris.push({...cargo,v:40});cargo=null;mode='missfall';return}if(cargo.x<left)debris.push({x:cargo.x,y:cargo.y,w:left-cargo.x,v:0});if(cargo.x+cargo.w>right)debris.push({x:right,y:cargo.y,w:cargo.x+cargo.w-right,v:0});stack.push({x:left,y:top.y-blockH,w:right-left});height++;update();offset=Math.max(0,300-stack.at(-1).y);newCargo();mode='moving';drop.disabled=false}
function box(b){ctx.fillStyle='#bb8546';ctx.fillRect(b.x,b.y,b.w,blockH);ctx.fillStyle='#e6b877';ctx.fillRect(b.x+2,b.y+2,b.w-4,7);ctx.strokeStyle='#704a28';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,blockH);for(let x=b.x+8;x<b.x+b.w;x+=24){ctx.fillStyle='#73583b';ctx.fillRect(x,b.y+12,4,16)}}
function draw(){ctx.fillStyle='#c6e5f3';ctx.fillRect(0,0,W,H);ctx.fillStyle='#b9cbd0';for(let i=0;i<6;i++){ctx.fillRect(i*75,H-180,45,130)}ctx.fillStyle='#e4c063';ctx.fillRect(14,10,16,H-60);ctx.fillRect(14,18,370,12);ctx.strokeStyle='#8b7432';for(let y=40;y<H-70;y+=30){ctx.beginPath();ctx.moveTo(14,y);ctx.lineTo(30,y+25);ctx.stroke()}ctx.fillStyle='#70846a';ctx.fillRect(0,570,W,30);ctx.save();ctx.translate(0,offset);stack.forEach(box);debris.forEach(box);ctx.restore();if(cargo){ctx.strokeStyle='#4b5862';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cargo.x+cargo.w/2,30);ctx.lineTo(cargo.x+cargo.w/2,cargo.y);ctx.stroke();box(cargo)}}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!document.hidden){if(mode==='moving'){phase+=dt*(1.5+height*.13);cargo.x=(W-cargo.w)/2+Math.sin(phase)*(W-cargo.w-12)/2}else if(mode==='falling'){cargo.v+=1000*dt;cargo.y+=cargo.v*dt;const target=stack.at(-1).y-blockH+offset;if(cargo.y>=target){cargo.y=target-offset;land()}}debris.forEach(b=>{b.v+=850*dt;b.y+=b.v*dt});if(mode==='missfall'&&debris.every(b=>b.y+offset>=H)){finish()}debris=debris.filter(b=>b.y+offset<H+100)}draw();requestAnimationFrame(tick)}
function back(){if(parent!==window){parent.postMessage({type:'crane-back'},'*');return false}location.href='./index.html';return false}drop.onclick=release;canvas.onclick=release;document.getElementById('start').onclick=start;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();release()}});panel.showModal();requestAnimationFrame(tick);
</script></html>
