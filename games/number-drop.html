<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ナンバードロップ</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f21;color:#f7f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffd163;outline-offset:3px}.app{width:min(100%,480px);min-height:100svh;margin:auto;padding:14px 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}header,.stats{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:21px}.pause{min-height:42px;padding:8px 12px;border:1px solid #52658a;border-radius:11px;background:#202b4a;color:white}.stats{font-variant-numeric:tabular-nums}.stat small{display:block;color:#aeb9d5;font-size:12px}.stat strong{font-size:24px}.field{position:relative;flex:1 1 auto;min-height:250px;height:42svh;max-height:440px;overflow:hidden;border:1px solid #39466b;border-radius:18px;background:linear-gradient(#171f3e,#10162e);isolation:isolate}.field:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#7e8fbd0b 1px,transparent 1px),linear-gradient(90deg,#7e8fbd0b 1px,transparent 1px);background-size:34px 34px}.danger{position:absolute;bottom:0;width:100%;height:28px;border-top:2px dashed #ff789a;background:#ff789a12;color:#ffb4c8;text-align:center;font-size:12px;padding-top:5px}.falling{position:absolute;top:0;left:0;display:grid;place-items:center;width:54px;height:48px;border-radius:14px;background:#75f0cc;color:#10162e;font-size:28px;font-weight:850;box-shadow:0 5px 0 #29997a;will-change:transform}.falling:nth-of-type(even){background:#ffd06e;box-shadow:0 5px 0 #b48323}.panel{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:18px;background:#111832f2;text-align:center;overflow:auto}.panel[hidden]{display:none}.panel-inner{width:100%;max-width:350px}.panel h2{font-size:25px;margin:8px 0}.panel p{font-size:16px;line-height:1.7;color:#c4cee7;margin:8px 0 16px}.primary{width:100%;min-height:48px;border:0;border-radius:13px;background:#75f0cc;color:#10162e;font-size:18px;font-weight:800}.hint{min-height:22px;margin:0;text-align:center;color:#bdc7e4;font-size:14px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key{min-height:48px;border:1px solid #425379;border-bottom:4px solid #070b18;border-radius:13px;background:#263457;color:white;font-size:27px;font-weight:800}.key:active{transform:translateY(2px);background:#425a88}.key:disabled{opacity:.42}.caption{margin:0;text-align:center;color:#8997bc;font-size:12px}@media(max-height:650px){.app{padding-top:8px;gap:6px}.field{height:34svh;min-height:190px}.key{min-height:42px}.panel{padding:10px}.panel h2{font-size:22px}.panel p{font-size:14px;line-height:1.55;margin-bottom:10px}}@media(prefers-reduced-motion:reduce){.falling{box-shadow:none}}
.mistake-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#bdc7e4}.mistakes{display:flex;gap:6px}.mistake-dot{width:11px;height:11px;border:1.5px solid #96a6cc;border-radius:50%}.mistake-dot.used{background:#ff789a;border-color:#ff789a}
</style></head><body><main class="app"><header><h1>ナンバードロップ</h1><button id="pause" class="pause" disabled>一時停止</button></header><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div><div class="stat"><small>NEXT LEVEL</small><strong id="progress">0 / 10</strong></div></div><div class="mistake-row"><span>押し間違い</span><div id="mistakes" class="mistakes" role="img" aria-label="押し間違い0回、10回で終了"><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span></div></div><section class="field" id="field" aria-label="数字が落ちるエリア"><div class="danger">ここまで落ちたら終了</div><div class="panel" id="panel"><div class="panel-inner"><h2 id="panelTitle">数字を消そう！</h2><p id="panelText">上から落ちてくる数字と同じボタンをタップ。10個消すごとに速くなるよ。<br>数字が下まで落ちるか、10回押し間違えると終了。</p><button id="start" class="primary">スタート</button></div></div></section><p class="hint" id="hint" role="status" aria-live="polite">同じ数字のボタンを押そう</p><div class="keys" id="keys" aria-label="1から9の数字ボタン"></div><p class="caption">同じ数字が複数ある場合は、一番下から消えます</p></main><script>
'use strict';
const $=id=>document.getElementById(id),buttons=[];let items=[],mode='ready',score=0,mistakes=0,last=0,nextSpawn=0,nextId=0,raf=null;
function difficulty(){const level=Math.floor(score/10)+1;return {level,speed:Math.min(110,33+(level-1)*8),interval:Math.max(420,1350-(level-1)*105)}}
function render(){const d=difficulty();$('score').textContent=score;$('level').textContent=d.level;$('progress').textContent=(score%10)+' / 10';Array.from($('mistakes').children).forEach((dot,index)=>dot.classList.toggle('used',index<mistakes));$('mistakes').setAttribute('aria-label',`押し間違い${mistakes}回、10回で終了`)}
function controls(){buttons.forEach(button=>button.disabled=mode!=='playing');$('pause').disabled=!['playing','paused'].includes(mode);$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function remove(item){item.element.remove();items=items.filter(value=>value!==item)}
function clear(){for(const item of items)item.element.remove();items=[]}
function spawn(){const field=$('field'),element=document.createElement('div'),number=1+Math.floor(Math.random()*9),lanes=Math.max(3,Math.min(5,Math.floor((field.clientWidth-12)/62))),lane=nextId++%lanes,width=54,x=8+lane*(field.clientWidth-width-16)/Math.max(1,lanes-1);element.className='falling';element.textContent=number;element.setAttribute('aria-label',`数字 ${number}`);const item={element,number,x,y:-55};items.push(item);field.append(element);draw(item)}
function draw(item){item.element.style.transform=`translate(${item.x}px,${item.y}px)`}
function finish(reason='数字が下まで落ちました'){if(mode!=='playing')return;mode='over';if(raf!==null)cancelAnimationFrame(raf);raf=null;controls();$('panelTitle').textContent='ゲームオーバー';$('panelText').textContent=`${score}個消しました。レベル${difficulty().level}まで到達！`;$('start').textContent='もう一度遊ぶ';$('panel').hidden=false;$('hint').textContent=reason;if(window.parent!==window)window.parent.postMessage({type:'number-drop-result',score},'*')}
function start(){if(raf!==null)cancelAnimationFrame(raf);clear();mode='playing';score=0;mistakes=0;nextId=0;last=performance.now();nextSpawn=last+difficulty().interval;render();controls();$('panel').hidden=true;$('hint').textContent='同じ数字をタップ！';spawn();raf=requestAnimationFrame(frame)}
function hit(number){if(mode!=='playing')return false;const target=items.filter(item=>item.number===number).sort((a,b)=>b.y-a.y)[0];if(!target){if(!items.length)return false;mistakes++;render();$('hint').textContent=`押し間違い ${mistakes} / 10`;if(mistakes>=10)finish('10回押し間違えたので終了！');return false}const before=difficulty().level;remove(target);score++;render();const after=difficulty().level;$('hint').textContent=after>before?`レベル${after}！ 速度と出現がアップ`:`${number}を消去！`;if(after>before)nextSpawn=Math.min(nextSpawn,performance.now()+difficulty().interval);return true}
function frame(now){raf=null;if(mode!=='playing')return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(now>=nextSpawn){spawn();nextSpawn=now+difficulty().interval}const speed=difficulty().speed;let reached=false;for(const item of items){item.y+=speed*dt;draw(item);if(item.y+48>=$('field').clientHeight-28)reached=true}if(reached){finish();return}raf=requestAnimationFrame(frame)}
function pause(){if(mode==='playing'){mode='paused';if(raf!==null)cancelAnimationFrame(raf);raf=null;$('panelTitle').textContent='ひとやすみ';$('panelText').textContent='ゲームは止まっています。';$('start').textContent='つづける';$('panel').hidden=false;controls();return}if(mode==='paused'){mode='playing';last=performance.now();nextSpawn=last+difficulty().interval;$('panel').hidden=true;controls();raf=requestAnimationFrame(frame)}}
for(let number=1;number<=9;number++){const button=document.createElement('button');button.className='key';button.textContent=number;button.setAttribute('aria-label',`数字 ${number}を消す`);button.onclick=()=>hit(number);$('keys').append(button);buttons.push(button)}
$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;document.addEventListener('keydown',event=>{if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;if(/^[1-9]$/.test(event.key)){event.preventDefault();hit(Number(event.key))}if(event.key==='Escape'&&mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('resize',()=>{for(const item of items){item.x=Math.min(item.x,$('field').clientWidth-62);draw(item)}});window.addEventListener('message',event=>{if(event.source===window.parent&&event.data?.type==='math-drop-pause'&&mode==='playing')pause()});controls();render();
</script></body></html>
