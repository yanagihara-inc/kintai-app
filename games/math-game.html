<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111631"><title>すうしきドロップ</title><meta name="description" content="落ちてくる数式を計算して消そう。答えはいつも1〜9！"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%237bfbce'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='30' fill='%23111631'%3E+%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f23;color:#f6f7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffdb73;outline-offset:3px}.app{max-width:480px;margin:auto;padding:16px 18px max(16px,env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column;gap:12px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;letter-spacing:.04em;margin:0}.brand{color:#7bfbce;font-size:12px;letter-spacing:.18em;margin-bottom:3px}.pause{background:#202846;color:#dce0f9;border:1px solid #394367;border-radius:12px;min-height:42px;padding:0 14px}.stats{display:flex;justify-content:space-between;align-items:center}.score{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.label{font-size:12px;color:#a8b2d4;margin-right:10px}.lives{color:#ff93b9;font-size:23px;letter-spacing:5px}.field{height:clamp(240px,43svh,430px);position:relative;overflow:hidden;border:1px solid #30395b;border-radius:20px;background:linear-gradient(180deg,#19203e,#11162f);isolation:isolate}.field:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#7985b20b 1px,transparent 1px),linear-gradient(90deg,#7985b20b 1px,transparent 1px);background-size:32px 32px}.danger{position:absolute;bottom:0;width:100%;height:28px;border-top:2px dashed #ff93b975;background:#ff93b90a;text-align:center;font-size:12px;color:#e19bb8;padding-top:5px;letter-spacing:.08em}.equation{position:absolute;top:0;left:0;width:104px;height:49px;display:grid;place-items:center;background:#7bfbce;color:#111631;border-radius:13px;font-size:27px;font-weight:800;box-shadow:0 5px 0 #3ab38f;will-change:transform}.equation.sub{background:#d0baff;box-shadow:0 5px 0 #8667b7}.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:22px;background:#111631ed;text-align:center}.overlay[hidden]{display:none}.symbol{font-size:42px;font-weight:900;letter-spacing:.13em;color:#7bfbce}h2{font-size:26px;margin:12px 0}p{font-size:15px;line-height:1.9;color:#bec8e8;margin:10px 0 20px}.start{border:0;background:#7bfbce;color:#10172c;padding:15px 28px;border-radius:14px;font-weight:800;font-size:18px;width:100%}.hint{text-align:center;font-size:14px;color:#b8c3e6;min-height:22px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{min-height:52px;border:1px solid #3b476e;border-bottom:4px solid #10152d;border-radius:14px;background:#263151;color:#fff;font-size:29px;font-weight:750}.key:active{transform:translateY(2px);background:#435478}.key:disabled{opacity:.4;cursor:default}.footer{font-size:12px;text-align:center;color:#8b97ba;margin:0}.field.miss{animation:flash .25s}.field.good{border-color:#7bfbce}@keyframes flash{50%{background:#612d4a}}@media(max-height:700px){.app{gap:8px;padding-top:10px}.key{min-height:44px}.field{height:37svh;min-height:210px}h2{margin:6px 0}p{margin:8px 0 12px}.symbol{font-size:30px}}@media(prefers-reduced-motion:reduce){.field.miss{animation:none}}
.levelbar{display:flex;justify-content:space-between;color:#7bfbce;font-size:13px;gap:8px}.equation.wide{width:150px;font-size:24px}.keys{gap:7px}.key{min-height:48px}.app{gap:9px}.field{height:clamp(210px,39svh,400px)}@media(max-height:650px){.app{padding-top:8px;gap:6px}.field{height:31svh;min-height:170px}.key{min-height:42px}.footer{font-size:12px}.overlay{padding:12px}h2{font-size:22px}.symbol{display:none}}
/* Start and result panels grow with their text instead of being clipped by the playfield. */
.field { flex-shrink:0; }
.field:has(.overlay:not([hidden])) { height:auto; }
.overlay { position:relative; inset:auto; width:100%; min-height:inherit; padding:20px 16px; }
.overlay > div { width:100%; min-width:0; }
.overlay h2 { font-size:clamp(1.25rem,6vw,1.625rem); line-height:1.4; overflow-wrap:anywhere; }
.overlay p { font-size:1rem; line-height:1.7; overflow-wrap:anywhere; }
.overlay .start { min-height:48px; white-space:normal; }
.app > * { flex-shrink:0; }
@media(max-height:650px) { .overlay { padding:16px 12px; } }
.lives{font-size:16px;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.lives{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}.mistake-dot{display:block;width:11px;height:11px;flex:0 0 11px;border:1.5px solid #9eabc9;border-radius:50%;background:transparent}.mistake-dot.used{background:#ff759a;border-color:#ff759a}@media(max-width:340px){.lives{gap:4px}.mistake-dot{width:10px;height:10px;flex-basis:10px}}
.mode-choice{display:grid;gap:8px;margin:12px 0 16px;text-align:left}.mode-choice select{width:100%;min-height:46px;background:#263151;color:#fff;border:1px solid #64759e;border-radius:10px;padding:8px;font:inherit}.mode-choice[hidden]{display:none}.run-info{display:flex;justify-content:space-between;gap:12px;color:#ffdb73;font-weight:700;font-size:15px}.score{font-size:clamp(18px,5.5vw,28px)}.stats{gap:8px;flex-wrap:wrap}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 20px}.results[hidden]{display:none}.results>div{background:#263151;border:1px solid #52638c;border-radius:12px;padding:12px 4px}.results span{display:block;font-size:16px;color:#d7e0f6}.results strong{display:block;font-size:32px;line-height:1.5;color:#7bfbce}.results small{font-size:13px;color:#bcc9e5}.results>div:nth-child(2) strong{color:#ff93b9}.results>div:nth-child(3) strong{color:#ffdb73}.back{width:100%;min-height:48px;margin-top:10px;border:1px solid #66799f;border-radius:14px;background:#263151;color:#fff;font-weight:700;font-size:17px}.back[hidden]{display:none}</style></head><body><main class="app"><header><div><div class="brand">MATH DROP</div><h1>すうしきドロップ</h1></div><button class="pause" id="pause" disabled>一時停止</button></header><div class="stats"><div><span class="label">SCORE</span><span class="score" id="score">0</span></div><span id="mistakes" hidden style="color:#ff93b9;font-weight:700">ミス 0回</span><div class="lives" id="lives" aria-label="ミス0回、10回で終了" role="img"><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span><span class="mistake-dot" aria-hidden="true"></span></div></div><section class="field" id="field" aria-label="数式が落ちてくるエリア"><div class="danger">ここまでに答えよう</div><div class="overlay" id="overlay"><div><div class="symbol">7 − 3</div><h2 id="title">計算して、消そう。</h2><p id="description">上から落ちてくる数式の答えをタップ。<br>答えはいつも <b>1〜9</b> の1桁！<br>5問ごとにレベルアップ。<br>30秒モードは速度2倍・最大3問。<br>ミスや落下でも30秒間続けられます。<br>得点は正解数−ミス回数−落下数（マイナスも表示）。<br>答えを10回間違えると終了。<br>数式が下まで落ちても終了。</p><div class="mode-choice" id="mode-choice"><label for="game-mode">遊び方</label><select id="game-mode"><option value="normal">通常モード</option><option value="challenge">30秒チャレンジ</option></select></div><div class="results" id="results" hidden><div><span>正解</span><strong id="result-correct">0</strong><small>問</small></div><div><span>間違い</span><strong id="result-mistakes">0</strong><small>回</small></div><div><span>落下</span><strong id="result-dropped">0</strong><small>問</small></div></div><button class="start" id="start">スタート</button><button class="back" id="back" hidden>ゲーム一覧へ戻る</button></div></div></section><div class="hint" id="hint" role="status" aria-live="polite">数字を1回タップするだけ</div><div class="levelbar"><span id="level">LEVEL 1 · 1桁の足し算</span><span id="progress">0 / 5</span></div><div class="run-info"><span id="time">通常モード</span></div><div class="keys" id="keys" aria-label="答えの数字ボタン"></div><p class="footer">同じ答えは、一番下の数式から消えるよ</p></main><script>
'use strict';
window.addEventListener('message',event=>{if(event.source===window.parent&&event.data?.type==='math-drop-pause'&&mode==='playing')pause();});
const $=id=>document.getElementById(id);let mistakes=0,dropped=0,gameMode='normal',remaining=30;let items=[],score=0,lives=10,mode='ready',last=0,spawnIn=0,nextId=0;const keys=[];
function difficulty(){const level=Math.floor(score/5)+1,phase=Math.floor((level-1)/3),step=(level-1)%3;const stage=phase<6?phase:2+((phase-6)%4);return {level,phase,stage,speed:20+step*12,interval:2.8-step*.4,label:['1桁の足し算','2桁の計算','数字3つ・1桁','数字3つ・2桁','かけ算・わり算','数字3つ・かけ算とわり算'][stage]}}
function randomInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function challengeProblem(){const answer=randomInt(1,9),kind=randomInt(0,3);let text;if(kind===0){const a=randomInt(1,Math.max(1,answer-1));text=a+' + '+(answer-a)}else if(kind===1){const b=randomInt(1,90);text=(b+answer)+' − '+b}else if(kind===2){const factors=[];for(let a=1;a<=answer;a++)if(answer%a===0)factors.push(a);const a=factors[randomInt(0,factors.length-1)];text=a+' × '+(answer/a)}else{const b=randomInt(1,Math.floor(99/answer));text=(answer*b)+' ÷ '+b}return {answer,text,sub:kind===1,wide:false}}
function makeProblem(stage=difficulty().stage){if(gameMode==='challenge')return challengeProblem();let a,b,c,answer,text;if(stage===0){a=randomInt(1,8);b=randomInt(1,9-a);answer=a+b;text=a+' + '+b}else if(stage===1){answer=randomInt(1,9);b=randomInt(10,89);a=b+answer;text=a+' − '+b}else if(stage===2){a=randomInt(1,7);b=randomInt(1,8-a);c=randomInt(1,9-a-b);answer=a+b+c;text=a+' + '+b+' + '+c}else if(stage===3){answer=randomInt(1,9);a=randomInt(20,79);b=randomInt(1,9);c=a+b-answer;text=a+' + '+b+' − '+c}else if(stage===4){if(Math.random()<.5){a=randomInt(1,9);b=randomInt(1,Math.floor(9/a));answer=a*b;text=a+' × '+b}else{answer=randomInt(1,9);b=randomInt(1,9);a=answer*b;text=a+' ÷ '+b}}else{answer=randomInt(1,9);const q=randomInt(2,9);b=randomInt(2,9);a=q*b;c=Math.abs(answer-q);text=a+' ÷ '+b+(answer>=q?' + ':' − ')+c}return {a,b,c,answer,text,sub:stage===1||stage===3,wide:stage===2||stage===3||stage===5}}
function spawn(){if(gameMode==='challenge'&&items.length>=3)return;const p=makeProblem(),el=document.createElement('div');el.className='equation'+(p.sub?' sub':'')+(p.wide?' wide':'');el.textContent=p.text;const w=$('field').clientWidth,width=p.wide?150:104;const lane=nextId++%(gameMode==='challenge'?3:2),x=gameMode==='challenge'?8+lane*(w-width-16)/2:8+lane*(w-width-16);const item={...p,el,x,y:-55};items.push(item);$('field').append(el);draw(item)}
function draw(i){i.el.style.transform=`translate(${i.x}px,${i.y}px)`}
function stats(){$('score').textContent=gameMode==='challenge'?score-mistakes-dropped:score;const d=difficulty();$('level').textContent='LEVEL '+d.level+' · '+(gameMode==='challenge'?'2桁まで・四則計算':d.label);$('progress').textContent=(score%5)+' / 5';$('time').textContent=gameMode==='challenge'?'残り '+remaining.toFixed(1)+'秒':'通常モード';$('lives').hidden=gameMode==='challenge';$('mistakes').hidden=gameMode!=='challenge';$('mistakes').textContent='ミス '+mistakes+'回';Array.from($('lives').children).forEach((dot,index)=>dot.classList.toggle('used',index<10-lives));$('lives').setAttribute('aria-label',`ミス${10-lives}回、10回で終了`)}
function controls(){keys.forEach(k=>k.disabled=mode!=='playing');$('pause').disabled=!['playing','paused'].includes(mode);$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function show(title,desc,button){$('title').textContent=title;$('description').textContent=desc;$('start').textContent=button;$('results').hidden=mode!=='over';$('back').hidden=mode!=='over';$('mode-choice').hidden=mode==='paused';$('overlay').hidden=false}
function start(){items.forEach(i=>i.el.remove());items=[];score=0;mistakes=0;dropped=0;remaining=30;gameMode=$('game-mode').value;$('results').hidden=true;$('back').hidden=true;lives=10;mode='playing';spawnIn=gameMode==='challenge'?.8:1.7;last=performance.now();stats();controls();$('overlay').hidden=true;$('hint').textContent='答えの数字をタップ！';spawn()}
function finish(reason='ゲームオーバー'){mode='over';const rankingScore=gameMode==='challenge'?score-mistakes-dropped:score;if(gameMode==='challenge'){try{localStorage.setItem('math-drop-last-challenge',JSON.stringify({score,rankingScore,mistakes,dropped,playedAt:new Date().toISOString()}))}catch{}}if(window.parent!==window)window.parent.postMessage({type:'math-drop-result',score:rankingScore,gameMode},'*');controls();$('result-correct').textContent=score;$('result-mistakes').textContent=mistakes;$('result-dropped').textContent=dropped;show(reason,`得点 ${rankingScore}点`,'もう一度遊ぶ');$('hint').textContent='おつかれさま！'}
function answer(n){if(!Number.isInteger(n)||n<1||n>9)throw new Error('答えは1〜9の整数です');if(mode!=='playing')return {accepted:false,reason:'ゲーム中ではありません'};const target=items.filter(i=>i.answer===n).sort((a,b)=>b.y-a.y)[0];if(!target){if(!items.length)return {accepted:false,reason:'出題待ちです'};mistakes++;if(gameMode!=='challenge')lives=Math.max(0,lives-1);stats();$('hint').textContent=gameMode==='challenge'?'答えが違うよ。ミス '+mistakes+'回':`答えが違うよ。ミス ${10-lives} / 10`;if(gameMode!=='challenge'&&lives===0)finish();return {accepted:false}}target.el.remove();items=items.filter(i=>i!==target);const before=difficulty();score++;stats();const after=difficulty();if(gameMode!=='challenge'&&after.phase!==before.phase){items.forEach(i=>i.el.remove());items=[];spawnIn=1.4}else if(after.level!==before.level){spawnIn=Math.min(spawnIn,after.interval)}$('hint').textContent=`${target.text} = ${n}　正解！`;if(after.level!==before.level)$('hint').textContent=after.phase!==before.phase?'新しい計算！ スピードをゆっくりにしたよ':'レベルアップ！ スピードアップ';return {accepted:true,score}}
function pause(){if(mode==='playing'){mode='paused';show('ひとやすみ','準備ができたら、続きを遊ぼう。','つづける')}else if(mode==='paused'){mode='playing';last=performance.now();$('overlay').hidden=true}controls()}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='key';b.textContent=n;b.setAttribute('aria-label',`答え ${n}`);b.onclick=()=>answer(n);$('keys').append(b);keys.push(b)}
$('back').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'math-drop-back'},'*');else window.location.href='./index.html'};
$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(/^[1-9]$/.test(e.key)){e.preventDefault();answer(Number(e.key))}if(e.key==='Escape')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('resize',()=>items.forEach(i=>{i.x=Math.min(i.x,$('field').clientWidth-(i.wide?158:112));draw(i)}));
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(mode==='playing'){if(gameMode==='challenge'){remaining=Math.max(0,remaining-dt);$('time').textContent='残り '+remaining.toFixed(1)+'秒';if(remaining===0){finish('30秒チャレンジ終了');requestAnimationFrame(frame);return}}spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=gameMode==='challenge'?.8:difficulty().interval}const speed=difficulty().speed*(gameMode==='challenge'?2:1);let missed=0;items=items.filter(i=>{i.y+=speed*dt;draw(i);if(i.y+49>=$('field').clientHeight-28){i.el.remove();missed++;return false}return true});if(missed){if(gameMode==='challenge'){dropped+=missed;stats();$('hint').textContent='数式が落ちたよ。残り時間で続けよう！'}else{dropped+=missed;finish();$('hint').textContent='数式が下まで落ちたので終了！'}}}requestAnimationFrame(frame)}controls();requestAnimationFrame(frame);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_math_game',description:'現在の数式、スコア、ゲーム状態を読む',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({mode,score,lives,level:difficulty().level,equations:items.map(i=>({expression:i.text}))})})).catch(()=>{});Promise.resolve(document.modelContext.registerTool({name:'answer_math_game',description:'プレイ中の数式に1〜9で答える',inputSchema:{type:'object',properties:{answer:{type:'integer',minimum:1,maximum:9}},required:['answer'],additionalProperties:false},execute:input=>answer(input.answer)})).catch(()=>{})}catch{}}
</script></body></html>
