<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横切りクイズ</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#243e55;font-family:system-ui}main{height:100dvh;max-width:520px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}a,button{font:inherit;border:0;border-radius:12px;padding:14px;background:#367da8;color:white;text-decoration:none;touch-action:manipulation}#stage{position:relative;flex:1;min-height:120px;overflow:hidden;border-radius:18px;background:linear-gradient(#afd9f4,#e5f4ff);display:grid;place-items:center}#object{position:absolute;font-size:90px;line-height:1.3;left:0;top:50%;transform:translate(-150px,-50%);will-change:transform}#stage.narrow #object{clip-path:inset(0)}#window{position:absolute;inset:0;overflow:hidden;pointer-events:none}#stage.narrow #window{left:37.5%;right:37.5%}#stage.narrow:before,#stage.narrow:after{content:"";position:absolute;top:0;bottom:0;width:37.5%;background:#324d65;z-index:2}#stage.narrow:before{left:0}#stage.narrow:after{right:0}#stage.narrow.fifth #window{left:40%;right:40%}#stage.narrow.fifth:before,#stage.narrow.fifth:after{width:40%}#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}#choices button{min-height:76px;background:white;color:#243e55;border:2px solid #c3dceb;font-weight:700}#choices button:disabled{opacity:.55}#notice{text-align:center;font-size:19px;font-weight:bold;min-height:28px;margin:0}#stats{display:flex;justify-content:space-between}#start{min-height:52px}#help{margin:0;font-size:14px;text-align:center}</style><main><header><h1>横切りクイズ</h1><a href="./index.html" onclick="return back()">一覧</a></header><div id="stats"><span>正解 <b id="score">0</b></span><span>レベル <b id="level">1</b></span><span>ミス <b id="miss">0</b> / 1</span></div><div id="stage"><div id="window"><span id="object" aria-hidden="true"></span></div><span id="center">何が通ったか覚えよう</span></div><p id="notice">スタートを押してください</p><div id="choices"></div><button id="start">スタート</button><p id="help">左から右に横切った物を４択で回答。１回ミスで終了。20問正解で見える範囲が４分の１、30問正解で５分の１になります。</p></main><script>
'use strict';const $=id=>document.getElementById(id),items=[['🍎','りんご'],['🍌','バナナ'],['🍓','いちご'],['🍉','すいか'],['⚽','サッカーボール'],['🏀','バスケットボール'],['🚗','車'],['🚲','自転車'],['✈️','飛行機'],['🐶','犬'],['🐱','猫'],['🐰','うさぎ'],['🔨','金槌'],['🔑','鍵'],['⏰','時計'],['🎈','風船']];let mode='ready',score=0,miss=0,target=null,elapsed=0,last=0,duration=1.4,delay=0;function shuffle(a){return a.sort(()=>Math.random()-.5)}function stats(){$('score').textContent=score;$('level').textContent=1+score;$('miss').textContent=miss}function round(){ stage.classList.toggle('narrow',score>=20);stage.classList.toggle('fifth',score>=30);target=items[Math.floor(Math.random()*items.length)];duration=Math.max(.22,1.4-score*.1);elapsed=0;mode='moving';$('start').hidden=true;$('center').textContent='';$('notice').textContent='よく見て！';$('choices').replaceChildren();$('object').textContent=target[0];$('object').style.transform='translate(-150px,-50%)'}function choices(){mode='answer';$('object').textContent='';$('notice').textContent='何が通りましたか？';shuffle([target,...shuffle(items.filter(i=>i!==target).slice()).slice(0,3)]).forEach(item=>{const b=document.createElement('button');b.textContent=item[0]+' '+item[1];b.onclick=()=>answer(item);$('choices').append(b)})}function answer(item){if(mode!=='answer')return;mode='feedback';$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);if(item===target){score++;$('notice').textContent='⭕ 正解！';$('notice').style.color='#22845a'}else{miss++;$('notice').textContent='✕ 正解は「'+target[1]+'」';$('notice').style.color='#c04444'}stats();delay=1.1;if(miss===1){mode='over';$('center').textContent='正解 '+score+'問';$('start').textContent='もう一度遊ぶ';$('start').hidden=false;if(parent!==window)parent.postMessage({type:'crossing-result',score},'*')}}function tick(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!document.hidden){if(mode==='moving'){elapsed+=dt;const width=$('stage').clientWidth;$('object').style.transform='translate('+(-150+(width+300)*Math.min(1,elapsed/duration)-(score>=30?width*.4:score>=20?width*.375:0))+'px,-50%)';if(elapsed>=duration)choices()}else if(mode==='feedback'){delay-=dt;if(delay<=0){$('notice').style.color='';round()}}}requestAnimationFrame(tick)}function back(){if(parent!==window){parent.postMessage({type:'crossing-back'},'*');return false}location.href='./index.html';return false}$('start').onclick=()=>{score=0;miss=0;stats();$('notice').style.color='';round()};requestAnimationFrame(tick);
</script></html>
