<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ハイスピードラン</title><style>*{box-sizing:border-box}body{margin:0;background:#071322;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}main{max-width:520px;margin:auto;height:100dvh;padding:10px;display:flex;flex-direction:column;gap:8px}header,.stats,.controls{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:21px;margin:0}.stats{font-size:15px;color:#cfe8f9}button{font:inherit;font-weight:700;border:0;border-radius:12px;background:#70e4ca;color:#09333a;cursor:pointer;touch-action:manipulation;padding:10px}#pause{font-size:13px}.controls button{flex:1;min-height:55px;font-size:26px}.arena{position:relative;flex:1;min-height:160px;border-radius:18px;overflow:hidden;border:1px solid #405475}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;inset:0;background:#08172ce8;display:grid;place-items:center;text-align:center;padding:20px}.panel[hidden]{display:none}.panel h2{color:#70e4ca;font-size:30px}.panel p{line-height:1.8;color:#d1dfef}.panel button{width:100%;min-height:52px;font-size:20px}.hint{margin:0;text-align:center;color:#b6c5d9;font-size:12px}</style></head><body><main><header><h1>ハイスピードラン</h1><button id="pause" disabled>一時停止</button></header><div class="stats"><span id="distance">距離 0m</span><span id="level">レベル 1</span><span id="speed">速度 100%</span><span id="best">最高 0m</span></div><div class="arena"><canvas id="road" aria-label="高速スクロールする3車線の道。左右に移動して障害物をよけよう"></canvas><div class="panel" id="panel"><div><h2 id="title">高速で駆け抜けよう</h2><p id="description">道が下へスクロールします。<br>スクーターを左右に動かして、岩や水のたまった穴を回避！<br>100mごとにレベルアップしてスピードアップ。<br>障害物に当たるとゲームオーバー。</p><button id="start">スタート</button></div></div></div><div class="controls"><button id="left" aria-label="左に移動">◀ 左</button><button id="right" aria-label="右に移動">右 ▶</button></div><p class="hint">左右スワイプ · 左右ボタン · パソコンは ← →</p></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('road'),ctx=canvas.getContext('2d');const sprite=new Image(),roadImage=new Image(),puddleImage=new Image(),scooterImage=new Image();sprite.src='./runner-obstacles.png';roadImage.src='./runner-road.png';puddleImage.src='./runner-puddle.png';scooterImage.src='./runner-scooter.png';let roadOffset=0,lean=0;let w=400,h=600,lane=1,x=200,state='ready',distance=0,best=0,speed=400,offset=0,rows=[],particles=[],spawnIn=.4,last=0,touchX=0;try{best=Number(localStorage.getItem('high-speed-run-best'))||0}catch{}$('best').textContent='最高 '+best+'m';
function center(n){return w*(.17+n*.33)}function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);x=center(lane)}addEventListener('resize',resize);resize();
function show(title,description,label){$('title').textContent=title;$('description').textContent=description;$('start').textContent=label;$('panel').hidden=false}function begin(){lane=1;x=center(lane);distance=0;speed=330;rows=[];particles=[];spawnIn=.5;offset=0;roadOffset=0;lean=0;state='playing';last=performance.now();$('panel').hidden=true;$('pause').disabled=false;$('pause').textContent='一時停止';stats()}
function level(){return Math.floor(distance/100)+1}function stats(){$('distance').textContent='距離 '+Math.floor(distance)+'m';$('level').textContent='レベル '+level();$('speed').textContent='速度 '+Math.round(speed/400*100)+'%';$('best').textContent='最高 '+best+'m'}function move(direction){if(state==='playing')lane=Math.max(0,Math.min(2,lane+direction))}function pause(){if(state==='playing'){state='paused';show('ひとやすみ','準備ができたら再開しよう。','つづける');$('pause').textContent='再開'}else if(state==='paused'){state='playing';last=performance.now();$('panel').hidden=true;$('pause').textContent='一時停止'}}function end(){if(state!=='playing')return;state='over';if(parent!==window)parent.postMessage({type:'runner-result',score:Math.floor(distance)},'*');best=Math.max(best,Math.floor(distance));try{localStorage.setItem('high-speed-run-best',best)}catch{}stats();$('pause').disabled=true;show('ゲームオーバー',Math.floor(distance)+'m走りました！ 最高 '+best+'m','もう一度遊ぶ')}
$('start').onclick=()=>state==='paused'?pause():begin();$('pause').onclick=pause;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-touchX;if(Math.abs(dx)>20)move(dx>0?1:-1)});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(!e.repeat)move(e.key==='ArrowLeft'?-1:1)}if(e.key==='Escape')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='math-drop-pause'&&state==='playing')pause()});
function spawn(){const safe=Math.floor(Math.random()*3),lanes=[0,1,2].filter(n=>n!==safe);if(distance<180||Math.random()<.4)lanes.splice(Math.floor(Math.random()*lanes.length),1);rows.push({y:-70,lanes,type:['barrier','rock','puddle'][Math.floor(Math.random()*3)]})}
function barrier(cx,y,width){ctx.fillStyle='#ec843b';ctx.fillRect(cx-width/2,y-20,width,40);ctx.fillStyle='#ffe4a7';for(let i=0;i<3;i++){ctx.save();ctx.beginPath();ctx.rect(cx-width/2,y-20,width,40);ctx.clip();ctx.translate(cx-width/2+i*width/3,y);ctx.rotate(-.55);ctx.fillRect(-4,-35,9,70);ctx.restore()}ctx.fillStyle='#404a57';ctx.fillRect(cx-width/2+5,y+20,7,9);ctx.fillRect(cx+width/2-12,y+20,7,9)}
function rock(cx,y,width){ctx.fillStyle='#74828e';ctx.beginPath();ctx.moveTo(cx-width*.5,y+18);ctx.lineTo(cx-width*.4,y-9);ctx.lineTo(cx-width*.1,y-26);ctx.lineTo(cx+width*.3,y-19);ctx.lineTo(cx+width*.5,y+12);ctx.lineTo(cx+width*.2,y+25);ctx.closePath();ctx.fill();ctx.fillStyle='#a1acb5';ctx.beginPath();ctx.moveTo(cx-width*.4,y-9);ctx.lineTo(cx-width*.1,y-26);ctx.lineTo(cx+width*.3,y-19);ctx.lineTo(cx,y+1);ctx.closePath();ctx.fill()}
function frame(now){const dt=Math.min((now-last)/1000||0,.035);last=now;if(state==='playing'){speed=Math.min(1000,400+(level()-1)*60);distance+=speed*dt/10;offset=(offset+speed*dt)%80;roadOffset=(roadOffset+speed*dt)%(w*1.5);const targetLean=Math.max(-.38,Math.min(.38,(center(lane)-x)/160));lean+=(targetLean-lean)*Math.min(1,dt*12);x+=(center(lane)-x)*Math.min(1,dt*18);spawnIn-=dt;if(spawnIn<=0){spawn();spawnIn=Math.max(.72,1.2-(level()-1)*.04)}for(const row of rows){row.y+=speed*dt;if(Math.abs(row.y-h*.8)<38&&row.lanes.some(n=>Math.abs(center(n)-x)<w*.105))end()}rows=rows.filter(r=>r.y<h+80);stats()}ctx.fillStyle='#123e39';ctx.fillRect(0,0,w,h);ctx.fillStyle='#263345';ctx.fillRect(w*.035,0,w*.93,h);ctx.fillStyle='#607080';ctx.fillRect(w*.035,0,5,h);ctx.fillRect(w*.965-5,0,5,h);ctx.fillStyle='#d0d5df';for(let y=offset-80;y<h;y+=80){ctx.fillRect(w*.335-2,y,4,40);ctx.fillRect(w*.665-2,y,4,40)}for(let y=offset-80;y<h;y+=80){ctx.fillStyle='#3e7864';ctx.fillRect(0,y,9,35);ctx.fillRect(w-9,y+20,9,35)}if(roadImage.complete&&roadImage.naturalWidth){const tileH=w*1.5;for(let yy=roadOffset-tileH;yy<h;yy+=tileH)ctx.drawImage(roadImage,0,yy,w,tileH)}for(const row of rows)for(const n of row.lanes){const cx=center(n),ww=w*.27;if(row.type==='puddle'&&puddleImage.complete&&puddleImage.naturalWidth)ctx.drawImage(puddleImage,cx-ww/2,row.y-ww*.4,ww,ww*.8);else if(sprite.complete&&sprite.naturalWidth){const half=sprite.naturalWidth/2;const sy=row.type==='rock'?half:0;const sx=row.type==='rock'?0:half;ctx.drawImage(sprite,sx,sy,half,half,cx-ww/2,row.y-ww/2,ww,ww)}else if(row.type==='barrier')barrier(cx,row.y,ww);else rock(cx,row.y,ww)}const y=h*.8;ctx.save();ctx.translate(x,y);ctx.rotate(lean);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(4,23,21,13,0,0,Math.PI*2);ctx.fill();if(scooterImage.complete&&scooterImage.naturalWidth)ctx.drawImage(scooterImage,-44,-53,88,106);else{ctx.fillStyle='#63e4d1';ctx.fillRect(-12,-27,24,54);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-5,8,0,Math.PI*2);ctx.fill()}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
