<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順番タップ</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#19324c;font-family:system-ui,sans-serif}.app{max-width:480px;margin:auto;padding:14px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}h1{font-size:23px;margin:0}.stats{display:flex;justify-content:space-between;background:white;padding:12px;border-radius:12px}.hint{min-height:26px;margin:0;text-align:center}button{font:inherit;touch-action:manipulation;border:0;border-radius:12px;min-height:56px;cursor:pointer}button:disabled{cursor:default}.board{display:grid;gap:10px;align-content:center;flex:1;min-height:180px}.board button{background:#fff;box-shadow:0 2px 5px #19324c20;font-size:28px;min-height:65px}.board button:focus-visible{outline:4px solid #163754;outline-offset:2px}.sample{height:64px;border-radius:12px;border:4px solid white}.primary{background:#357bad;color:white;padding:12px}.overlay{position:fixed;inset:0;background:#edf3ffed;display:flex;align-items:center;justify-content:center;padding:16px}.overlay[hidden]{display:none}.panel{max-width:420px;background:white;border-radius:18px;padding:22px;width:100%;max-height:95dvh;overflow:auto}.panel h2{margin-top:0}.panel p{line-height:1.7}@media(max-height:550px){.app{gap:6px;padding:8px}.board button{min-height:44px}.sample{height:40px}}</style><main class="app"><h1>順番タップ</h1><div class="stats"><span>得点 <b id="score">0</b>個</span><span id="time"></span></div><p id="hint" class="hint"></p><div id="sample" class="sample" hidden></div><div id="board" class="board"></div><button id="pause" class="primary" disabled>一時停止</button></main><div id="overlay" class="overlay"><section class="panel"><h2 id="title">順番タップ</h2><p id="description">数字を1から順番にタップ。60秒で何個押せる？ 押し間違いは得点になりません。</p><button id="start" class="primary">スタート</button></section></div><script>
'use strict';const $=id=>document.getElementById(id),board=$('board'),hint=$('hint'),sample=$('sample');let mode='ready',score=0,remaining=60000,last=0,raf=null,nextTimer=null;const timed=true;
function button(label,handler){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(mode!=='playing')return;advance(performance.now());if(mode==='playing')handler()};return b}
function update(){$('score').textContent=score;$('time').textContent=timed?'残り '+Math.ceil(remaining/1000)+'秒':'連続成功';}
function stop(){if(raf!==null)cancelAnimationFrame(raf);raf=null;if(nextTimer!==null)clearTimeout(nextTimer);nextTimer=null}
function advance(now){if(mode!=='playing')return;remaining=Math.max(0,remaining-Math.max(0,now-last));last=now;update();if(timed&&remaining===0)finish('時間切れです。')}
function tick(now){raf=null;advance(now);if(mode==='playing'&&timed)raf=requestAnimationFrame(tick)}
function finish(reason){if(mode!=='playing')return;mode='over';stop();$('pause').disabled=true;$('title').textContent='挑戦終了';$('description').textContent=reason+' 得点は '+score+'個です。';$('start').textContent='もう一度遊ぶ';$('overlay').hidden=false;if(window.parent!==window)window.parent.postMessage({type:'order-game-result',score},'*')}
function round(){const count=Math.min(16,4+Math.floor(score/12)),nums=Array.from({length:count},(_,i)=>i+1);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}let next=1;hint.textContent='次は '+next;board.style.gridTemplateColumns='repeat(4,1fr)';nums.forEach(n=>{const b=button(n,()=>{if(n!==next){hint.textContent='次は '+next+' です';return}b.disabled=true;b.style.opacity='.25';score++;next++;update();hint.textContent='次は '+next;if(next>count){board.replaceChildren();round()}});board.append(b)})}
function start(){stop();mode='playing';score=0;remaining=60000;last=performance.now();board.replaceChildren();round();update();$('overlay').hidden=true;$('pause').disabled=false;$('pause').textContent='一時停止';if(timed)raf=requestAnimationFrame(tick)}
function pause(){if(mode==='playing'){advance(performance.now());if(mode!=='playing')return;mode='paused';stop();$('overlay').hidden=false;$('title').textContent='ひとやすみ';$('description').textContent='準備ができたら続けましょう。';$('start').textContent='つづける';$('pause').textContent='再開'}else if(mode==='paused'){mode='playing';last=performance.now();$('overlay').hidden=true;$('pause').textContent='一時停止';if('order'==='chest'&&board.children[0]?.disabled){board.replaceChildren();round()}if(timed)raf=requestAnimationFrame(tick)}}
$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='math-drop-pause'&&mode==='playing')pause()});update();
</script></html>
