<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひかる順番</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#203c54;font-family:system-ui,sans-serif}.app{max-width:460px;margin:auto;padding:12px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}h1{font-size:24px;margin:0}.stats{display:flex;justify-content:space-between;background:white;padding:12px;border-radius:12px}#hint{text-align:center;min-height:45px;font-size:19px;font-weight:bold}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:auto 0}.tile{aspect-ratio:1;border:3px solid #8aa9c2;background:#ccdfed;border-radius:16px;font-size:25px;color:#294961;touch-action:manipulation}.tile:nth-child(1){background:#ef8b8b;border-color:#bb4848}.tile:nth-child(2){background:#f3af6d;border-color:#b96b22}.tile:nth-child(3){background:#f0d56b;border-color:#aa8a22}.tile:nth-child(4){background:#91cc86;border-color:#4f8c45}.tile:nth-child(5){background:#6dccb5;border-color:#328c76}.tile:nth-child(6){background:#80c8ec;border-color:#3b88b0}.tile:nth-child(7){background:#909fe8;border-color:#5365b3}.tile:nth-child(8){background:#c89be1;border-color:#8b58a7}.tile:nth-child(9){background:#ed9dc7;border-color:#b7588c}.tile:disabled{opacity:1}.tile.lit{filter:brightness(1.25) saturate(1.35);box-shadow:0 0 20px #f5c842,0 0 0 4px #f5c842;transform:scale(1.03)}.tile.wrong{background:#ffb3b3;border-color:#bd3535}.actions{display:flex;gap:10px}button{font:inherit;min-height:48px;cursor:pointer}.actions button,.panel button{border:0;border-radius:10px;background:#357bad;color:white;padding:10px;flex:1}#overlay{position:fixed;inset:0;background:#edf3f8ee;display:flex;align-items:center;justify-content:center;padding:16px}#overlay[hidden]{display:none}.panel{background:white;border-radius:18px;padding:22px;max-width:410px;max-height:95dvh;overflow:auto}.panel p{line-height:1.7}.panel button{width:100%}#time{font-weight:bold;color:#b13d38}@media(max-height:570px){.board{max-width:280px;width:100%;align-self:center;gap:8px}.app{gap:5px}#hint{margin:0;min-height:30px;font-size:16px}}</style><main class="app"><h1>ひかる順番</h1><div class="stats"><span>レベル <b id="level">1</b></span><span>クリア <b id="score">0</b></span><span id="time">残り5秒</span></div><p id="hint" aria-live="polite">光る順番を覚えよう</p><div class="board" id="board"></div><div class="actions"><button id="pause" disabled>一時停止</button><button id="back">一覧へ戻る</button></div></main><div id="overlay"><section class="panel"><h2 id="title">ひかる順番</h2><p id="description">9個のマスが光る順番を覚えて、同じ順番でタップ！ 最初は3回。1回目は一定のテンポ、2回目は間隔が変わります。2回正解したら1回増えます。回答時間は3回で5秒、1回増えるごとに1秒延長。間違い・時間切れで終了です。</p><button id="start">スタート</button></section></div><script>
'use strict';const $=id=>document.getElementById(id);let sequence=[],position=0,level=1,score=0,roundWins=0,phase='ready',token=0,deadline=0,timer=null;const scheduled=new Set();const cells=Array.from({length:9},(_,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=i+1;b.setAttribute('aria-label',(i+1)+'番のマス');b.disabled=true;b.onclick=()=>answer(i);$('board').append(b);return b});
function later(fn,ms){const t=token;const id=setTimeout(()=>{scheduled.delete(id);if(t===token)fn()},ms);scheduled.add(id)}function clear(){token++;scheduled.forEach(clearTimeout);scheduled.clear();clearInterval(timer);timer=null;cells.forEach(b=>b.classList.remove('lit','wrong'))}function lock(yes){cells.forEach(b=>b.disabled=yes)}function randomCell(){return Math.floor(Math.random()*9)}
function finish(reason){if(phase==='over')return;clear();phase='over';lock(true);$('pause').disabled=true;$('hint').textContent=reason;$('title').textContent='挑戦終了';$('description').textContent=reason+' 正解した回数：'+score;$('start').textContent='もう一度遊ぶ';later(()=>{$('overlay').hidden=false;if(parent!==window)parent.postMessage({type:'memory-game-result',score},'*')},650)}
function updateTime(){if(phase!=='answer')return;const remaining=Math.max(0,deadline-performance.now());$('time').textContent='残り'+(remaining/1000).toFixed(1)+'秒';if(remaining===0)finish('時間切れです')}
function answerSeconds(){return 5+Math.max(0,sequence.length-3)}
function show(){clear();phase='showing';position=0;lock(true);$('pause').disabled=false;$('hint').textContent='光る順番を覚えてください';$('time').textContent='回答は'+answerSeconds()+'秒';const duration=Math.max(200,500-(level-1)*25),gap=200;let elapsed=450;sequence.forEach((n,i)=>{const offset=elapsed;later(()=>cells[n].classList.add('lit'),offset);later(()=>cells[n].classList.remove('lit'),offset+duration);const interval=roundWins===1?[80,850,120,650][i%4]:gap;elapsed+=duration+interval});later(()=>{phase='answer';lock(false);deadline=performance.now()+answerSeconds()*1000;$('hint').textContent='順番にタップ 0 / '+sequence.length;updateTime();timer=setInterval(updateTime,50)},elapsed)}
function answer(n){if(phase!=='answer')return;updateTime();if(phase!=='answer')return;if(n!==sequence[position]){finish('× 順番が違います');cells[n].classList.add('wrong');return}cells[n].classList.add('lit');later(()=>cells[n].classList.remove('lit'),150);position++;$('hint').textContent='順番にタップ '+position+' / '+sequence.length;if(position===sequence.length){phase='between';clearInterval(timer);lock(true);score++;roundWins++;$('score').textContent=score;$('hint').textContent=roundWins===2?'○ 正解！ 次は'+(sequence.length+1)+'回':'○ 正解！ あと1回正解で長くなります';later(()=>{if(roundWins===2){roundWins=0;level++;$('level').textContent=level;sequence=Array.from({length:sequence.length+1},randomCell)}else sequence=Array.from({length:sequence.length},randomCell);show()},900)}}
function start(){clear();level=1;score=0;roundWins=0;sequence=Array.from({length:3},randomCell);$('level').textContent=1;$('score').textContent=0;$('overlay').hidden=true;show()}function pause(){if(!['showing','answer','between'].includes(phase))return;clear();phase='paused';lock(true);$('overlay').hidden=false;$('title').textContent='一時停止';$('description').textContent='同じ順番をもう一度表示して再開します。';$('start').textContent='つづける'}$('start').onclick=()=>{if(phase==='paused'){$('overlay').hidden=true;show()}else start()};$('pause').onclick=pause;$('back').onclick=()=>{clear();if(parent!==window)parent.postMessage({type:'memory-game-back'},'*');else location.href='./index.html'};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='math-drop-pause')pause()});
</script></html>
