<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風船タップ</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf6ff;color:#264d65;font-family:system-ui,sans-serif}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:10px;gap:8px}.top,.stats{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;font-size:23px}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0;border-radius:10px;padding:10px;background:#357bad;color:white;min-height:44px}.stats{background:white;padding:10px;border-radius:12px}.sky{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:linear-gradient(#bce5ff,#f4fbff);touch-action:manipulation}.sky:before{content:'';position:absolute;width:130px;height:36px;border-radius:50%;background:#ffffff80;left:30px;top:60px;box-shadow:200px 130px 0 #ffffff70}.balloon{position:absolute;padding:0;min-height:0;border:2px solid #ffffffa0;border-radius:50% 50% 48% 48%;background:var(--color);box-shadow:inset -8px -6px 0 #00000015;will-change:transform}.balloon:before{content:'';position:absolute;background:#ffffff80;width:20%;height:27%;left:20%;top:14%;border-radius:50%;transform:rotate(25deg)}.balloon:after{content:'';position:absolute;top:100%;left:50%;width:1px;height:28px;background:#66869b;pointer-events:none}.fragment{position:absolute;width:9px;height:13px;border-radius:2px;pointer-events:none;animation:fragment .45s ease-out forwards}.burst-ring{position:absolute;width:30px;height:30px;border:3px solid #ffffff;border-radius:50%;pointer-events:none;animation:ring .35s ease-out forwards}@keyframes fragment{to{transform:translate(var(--dx),var(--dy)) rotate(var(--turn));opacity:0}}@keyframes ring{to{transform:scale(3);opacity:0}}.pop{position:absolute;font-size:25px;font-weight:bold;color:#254c69;pointer-events:none;animation:pop .45s ease-out forwards}@keyframes pop{to{transform:translateY(-35px);opacity:0}}#hint{margin:0;text-align:center;font-size:13px}#overlay{position:fixed;inset:0;background:#eaf6fff0;display:flex;align-items:center;justify-content:center;padding:16px}#overlay[hidden]{display:none}.panel{max-width:410px;background:white;border-radius:18px;padding:24px;max-height:95dvh;overflow:auto}.panel h2{margin-top:0}.panel p{line-height:1.7}.panel button{width:100%;margin-top:8px}.secondary{background:#dce9f1;color:#264d65}</style><main class="app"><div class="top"><h1>風船タップ</h1><button id="pause" disabled>一時停止</button><button id="back" class="secondary">一覧</button></div><div class="stats"><span>得点 <b id="score">0</b></span><span>割った数 <b id="count">0</b></span><span>残り <b id="time">30</b>秒</span></div><div id="sky" class="sky" aria-label="浮かんでくる風船"></div><p id="hint">小さい風船は3点・中は2点・大は1点</p></main><div id="overlay"><section class="panel"><h2 id="title">風船タップ</h2><p id="description">30秒で風船をタップして割ろう！ 小さい風船ほど高得点。時間がたつほど速く浮かびます。逃してもゲームは続きます。高速モードは最初20秒は1〜2個、次の5秒は少し多め、最後の5秒はたくさん！</p><label for="balloonMode">遊び方</label><select id="balloonMode" style="font:inherit;width:100%;padding:12px;margin-top:8px"><option value="normal">通常モード</option><option value="fast">高速モード</option></select><button id="start">スタート</button><button id="resultBack" class="secondary" hidden>ゲーム一覧へ戻る</button></section></div><script>
'use strict';const $=id=>document.getElementById(id);let fastMode=false;let mode='ready',score=0,count=0,remaining=30,last=0,spawnTimer=0,balloons=[],popTimers=new Set();const colors=['#f08094','#f3b34d','#7ebd79','#72b9e6','#b395d9','#e58abe'];
function update(){$('score').textContent=score;$('count').textContent=count;$('time').textContent=Math.ceil(remaining)}
function spawn(){const sky=$('sky'),width=sky.clientWidth,height=sky.clientHeight,type=Math.floor(Math.random()*3),size=[44,60,80][type],points=3-type,x=8+Math.random()*Math.max(0,width-size-16),b=document.createElement('button');b.className='balloon';b.style.width=size+'px';b.style.height=size*1.2+'px';b.style.setProperty('--color',colors[Math.floor(Math.random()*colors.length)]);b.setAttribute('aria-label',points+'点の風船');const item={b,x,y:height+30,size,points,speed:(55+Math.random()*35+(30-remaining)*3)*(fastMode?1.6:1),alive:true};b.onclick=()=>hit(item);sky.append(b);balloons.push(item)}
function burst(item){const centerX=item.x+item.size/2,centerY=item.y+item.size*.6;for(let i=0;i<8;i++){const fragment=document.createElement('span');fragment.className='fragment';const angle=i*Math.PI/4;fragment.style.left=centerX+'px';fragment.style.top=centerY+'px';fragment.style.background=item.b.style.getPropertyValue('--color');fragment.style.setProperty('--dx',Math.cos(angle)*55+'px');fragment.style.setProperty('--dy',Math.sin(angle)*55+'px');fragment.style.setProperty('--turn',i*65+'deg');$('sky').append(fragment);const t=setTimeout(()=>{fragment.remove();popTimers.delete(t)},450);popTimers.add(t)}const ring=document.createElement('span');ring.className='burst-ring';ring.style.left=(centerX-15)+'px';ring.style.top=(centerY-15)+'px';$('sky').append(ring);const t=setTimeout(()=>{ring.remove();popTimers.delete(t)},450);popTimers.add(t)}
function hit(item){if(mode!=='playing'||!item.alive)return;advance(performance.now());if(mode!=='playing')return;item.alive=false;burst(item);item.b.remove();score+=item.points;count++;update();const p=document.createElement('span');p.className='pop';p.textContent='+'+item.points;p.style.left=item.x+'px';p.style.top=Math.max(0,item.y)+'px';$('sky').append(p);const t=setTimeout(()=>{p.remove();popTimers.delete(t)},450);popTimers.add(t)}
function finish(){if(mode!=='playing')return;mode='over';balloons.forEach(x=>x.b.disabled=true);$('pause').disabled=true;$('title').textContent='チャレンジ終了';$('description').textContent='得点 '+score+'点 ／ 割った風船 '+count+'個';$('start').textContent='もう一度遊ぶ';$('balloonMode').hidden=false;$('resultBack').hidden=false;$('overlay').hidden=false;if(parent!==window)parent.postMessage({type:'balloon-result',score,fastMode},'*')}
function advance(now){if(mode!=='playing'){last=now;return 0}const dt=last?Math.max(0,(now-last)/1000):0;last=now;remaining=Math.max(0,remaining-dt);update();if(remaining===0){finish();return 0}return Math.min(.1,dt)}
function tick(now){const dt=advance(now);if(mode==='playing'){spawnTimer-=dt;if(spawnTimer<=0){const limit=fastMode?(remaining>10?2:remaining>5?5:16):Infinity;if(balloons.filter(b=>b.alive).length<limit)spawn();spawnTimer=fastMode?(remaining>10?.65:remaining>5?.28:.09):Math.max(.25,.7-(30-remaining)*.012)}const h=$('sky').clientHeight;balloons=balloons.filter(item=>{if(!item.alive)return false;item.y-=item.speed*dt;item.b.style.transform='translate('+item.x+'px,'+item.y+'px)';if(item.y<-item.size*1.2-35){item.b.remove();return false}return true})}requestAnimationFrame(tick)}
function start(){fastMode=$('balloonMode').value==='fast';$('balloonMode').hidden=true;popTimers.forEach(clearTimeout);popTimers.clear();$('sky').replaceChildren();balloons=[];score=0;count=0;remaining=30;last=performance.now();spawnTimer=0;mode='playing';$('overlay').hidden=true;$('resultBack').hidden=true;$('pause').disabled=false;update()}
function pause(){if(mode!=='playing')return;advance(performance.now());if(mode!=='playing')return;mode='paused';$('title').textContent='一時停止';$('description').textContent='準備ができたら続けましょう。';$('start').textContent='つづける';$('overlay').hidden=false}
function back(){if(parent!==window)parent.postMessage({type:'balloon-back'},'*');else location.href='./index.html'}$('start').onclick=()=>{if(mode==='paused'){mode='playing';last=performance.now();$('overlay').hidden=true}else start()};$('pause').onclick=pause;$('back').onclick=back;$('resultBack').onclick=back;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='math-drop-pause')pause()});requestAnimationFrame(tick);
</script></html>
