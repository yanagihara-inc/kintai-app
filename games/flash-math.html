<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フラッシュ暗算</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10162c;color:#fff;font-family:system-ui,sans-serif}main{max-width:480px;margin:auto;padding:20px}h1{font-size:24px}p{line-height:1.7;color:#cad5ed}.screen{height:220px;display:grid;place-items:center;background:#1e2b49;border-radius:20px;font-size:76px;font-weight:800;color:#7bfbce;margin:16px 0}button,input{font:inherit;min-height:48px;border-radius:12px;border:0;padding:12px}button{background:#7bfbce;color:#102439;font-weight:700;cursor:pointer;width:100%}input{width:100%;background:#fff;color:#17243a;font-size:24px;margin-bottom:10px}.stats{display:flex;justify-content:space-between}#feedback{min-height:52px}button:disabled{opacity:.5}[hidden]{display:none!important}@media(max-height:600px){.screen{height:160px}main{padding:12px}}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.choices button{font-size:26px;min-height:60px}.choices button:focus-visible{outline:3px solid #ffd879;outline-offset:3px}.screen.wrong{color:#ff637f;font-size:250px;line-height:.8}@media(max-height:600px){.screen.wrong{font-size:190px}}</style>
<main>
<h1>フラッシュ暗算</h1>
<p>順番に出る数字を足して、合計を答えよう。<br>正解すると数字の数が増え、表示も速くなります。回答は5秒以内。時間切れもミスになります。3回ミスすると終了。</p>
<div class="stats">
<span id="level">レベル 1</span>
<span id="score">正解 0問</span>
<span id="miss">ミス 0 / 3</span>
</div>
<div class="screen" id="screen" aria-live="off">＋</div>
<div id="feedback" role="status">最初は1桁の数字を3つ、0.7秒ずつ表示します。</div>
<div id="answerForm" hidden>
<p>合計はいくつ？</p>
<p id="answerTime" role="timer" style="font-size:22px;font-weight:700;color:#ffdb73">残り 5秒</p>
<div class="choices" id="choices" aria-label="答えの候補">
</div>
</div>
<button id="start">スタート</button>
</main>
<script>
let score=0,miss=0,total=0,active=false,timers=[],run=0,answerClock=null,answerDeadline=0;const $=id=>document.getElementById(id);
function settings(){return {count:Math.min(3+Math.floor(score/2),10),duration:Math.max(150,700-score*50),max:score<10?9:99}}
function stopAnswerClock(){clearInterval(answerClock);answerClock=null}function clear(){stopAnswerClock();timers.forEach(clearTimeout);timers=[];run++}function later(fn,delay){const id=run;timers.push(setTimeout(()=>{if(id===run)fn()},delay))}
function stats(){$('level').textContent='レベル '+(score+1);$('score').textContent='正解 '+score+'問';$('miss').textContent='ミス '+miss+' / 3'}
function round(){clear();$('screen').classList.remove('wrong');$('screen').removeAttribute('aria-label');active=true;$('start').hidden=true;$('answerForm').hidden=true;const d=settings();const nums=Array.from({length:d.count},()=>1+Math.floor(Math.random()*d.max));total=nums.reduce((a,b)=>a+b,0);$('feedback').textContent=d.count+'個の数字を足してね';$('screen').textContent='準備';let time=700;nums.forEach(n=>{later(()=>{$('screen').textContent=n},time);time+=d.duration;later(()=>{$('screen').textContent=''},time);time+=140});later(()=>{$('screen').textContent='？';showChoices()},time)}
function start(){score=0;miss=0;stats();round()}$('start').onclick=start;function showChoices(){const values=new Set([total]);while(values.size<4){const offset=1+Math.floor(Math.random()*Math.max(6,Math.ceil(total*.3)));const candidate=total+(Math.random()<.5?-offset:offset);if(candidate>0)values.add(candidate)}const choices=[...values];for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]]}$('choices').replaceChildren();for(const value of choices){const button=document.createElement('button');button.type='button';button.textContent=value;button.setAttribute('aria-label','答え '+value);button.onclick=()=>submitAnswer(value);$('choices').append(button)}$('answerForm').hidden=false;answerDeadline=performance.now()+5000;stopAnswerClock();$('answerTime').textContent='残り 5.0秒';answerClock=setInterval(()=>{const remaining=Math.max(0,(answerDeadline-performance.now())/1000);$('answerTime').textContent='残り '+remaining.toFixed(1)+'秒';if(remaining<=0)submitAnswer(null)},100)}
function submitAnswer(value){if(!active)return;if(performance.now()>=answerDeadline)value=null;stopAnswerClock();active=false;$('answerForm').hidden=true;if(value===total){score++;$('feedback').textContent='正解！ 合計は '+total}else{miss++;$('screen').classList.add('wrong');$('screen').textContent='×';$('screen').setAttribute('aria-label','不正解');$('feedback').textContent=(value===null?'時間切れ！ ':'')+'合計は '+total+' でした'}stats();if(miss>=3){clear();$('screen').textContent='×';$('start').textContent='もう一度遊ぶ';$('start').hidden=false}else later(round,1300)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){clear();active=false;$('answerForm').hidden=true;$('screen').textContent='中断';$('feedback').textContent='画面を離れたので中断しました。同じレベルで再開できます。';$('start').textContent='このレベルから再開';$('start').hidden=false;$('start').onclick=()=>{$('start').onclick=start;stats();round()}}});
</script>
</html>
