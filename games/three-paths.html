<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三本道迷路</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b22;color:#f6f8ee;font-family:system-ui,sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #ffde79;outline-offset:3px}main{max-width:460px;margin:auto;padding:12px 16px 18px}header,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.pause{min-height:44px;background:#314340;border:1px solid #718780;color:white;border-radius:10px;padding:9px}.stats{margin:10px 0;font-size:14px;color:#c6d3cb}.stats strong{font-size:23px;color:#fff;font-variant-numeric:tabular-nums}.scene{height:clamp(240px,46svh,450px);position:relative;border:2px solid #657967;border-radius:16px;overflow:hidden;background:#3f4d3d}.road{position:absolute;inset:0;background-size:100% auto;background-repeat:repeat-y;background-position:0 var(--scroll,0px)}.shade{position:absolute;inset:0;background:linear-gradient(#09191220,#09191205,#09191250)}.gate{position:absolute;top:0;height:36px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 7px;will-change:transform}.gate>div{border:2px solid #e2e3d4;border-radius:5px;background:repeating-linear-gradient(135deg,#392b22 0 12px,#d5b575 12px 24px);box-shadow:0 4px 8px #0008}.gate>div.safe{background:transparent;border:0;box-shadow:none}.mark{position:absolute;top:19%;width:33.333%;text-align:center;font-size:38px;color:#ffed87;text-shadow:0 2px 6px #000;font-weight:900;pointer-events:none}.player{position:absolute;bottom:30px;width:33.333%;text-align:center;color:#fff;font-size:27px;text-shadow:0 2px 5px #000}.line{position:absolute;bottom:22px;left:0;right:0;border-top:2px dashed #ffffff70}.overlay{position:absolute;inset:0;background:#102024f0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;text-align:center}.overlay[hidden]{display:none}.overlay>div{margin:auto 0;width:100%}h2{font-size:23px;margin:0 0 10px}p{font-size:16px;line-height:1.7}.start{width:100%;min-height:48px;background:#bee1a2;color:#152820;border:0;border-radius:12px;font-weight:800;font-size:18px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.key{height:60px;background:#314340;border:2px solid #718780;border-radius:13px;color:#fff;font-size:30px;font-weight:800}.key.selected{background:#bee1a2;color:#142820;border-color:#e7ffdc}.key:disabled{opacity:.5}.hint{min-height:27px;margin:9px 0;font-size:14px;text-align:center;color:#d4e4c8}.progress{height:7px;background:#33483e;border-radius:5px;overflow:hidden;margin:8px 0}.progress>div{height:100%;width:100%;background:#eac877;transform-origin:left;will-change:transform}.meta{text-align:center;color:#adbeb2;font-size:12px}@media(max-height:600px){.scene{height:35svh;min-height:200px}.key{height:48px}p{font-size:14px}}
.creatures{position:absolute;top:19%;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:48px;pointer-events:none;line-height:1.4;filter:drop-shadow(0 2px 4px #000)}.creatures span{min-width:0}
.gate>div{background:none;border:0;box-shadow:none;display:grid;place-items:center;font-size:38px;line-height:1}.gate .puddle{width:72%;height:26px;justify-self:center;align-self:center;border-radius:50%;background:radial-gradient(ellipse,#80c4d4aa,#376c90aa);border:2px solid #99ccdd;box-shadow:0 3px 5px #102b3f88}.gate .safe{background:transparent;border:0;box-shadow:none}.player{font-size:34px;line-height:1.2}
.player{transition:left .18s ease-out}.walker{display:inline-block;transform-origin:50% 85%;animation:walker-step .5s ease-in-out infinite;animation-play-state:paused}.scene.walking .walker{animation-play-state:running}@keyframes walker-step{0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-4px) rotate(0)}50%{transform:translateY(0) rotate(5deg)}75%{transform:translateY(-4px) rotate(0)}}@media(prefers-reduced-motion:reduce){.player{transition:none}.walker{animation:none}}
.sprite,.gate .obstacle{background-image:url('./asset-43d4397c3a167072.png');background-size:300% 300%;background-repeat:no-repeat}.creatures{align-items:center;justify-items:center}.creatures .sprite{display:block;width:1.5em;height:1.5em;max-width:95%;filter:drop-shadow(0 3px 3px #0009)}.sprite.dog{background-position:0% 0%}.sprite.fox{background-position:50% 0%}.sprite.bear{background-position:100% 0%}.sprite.ogre{background-position:0% 50%}.sprite.gargoyle{background-position:50% 50%}.sprite.reptile{background-position:100% 50%}.gate{height:64px}.gate .obstacle{width:68px;max-width:100%;height:64px;justify-self:center;border:0;border-radius:0;box-shadow:none;background-color:transparent}.gate .rock{background-position:0% 100%}.gate .hole{background-position:50% 100%}.gate .puddle{background-position:100% 100%}.gate .safe{background:none}
.creatures .sprite.rabbit{background-image:url('./asset-97abcb8d10d4c042.png');background-size:contain;background-position:center;background-repeat:no-repeat}
.runner{display:inline-block;width:62px;height:62px;background-image:url('./asset-87c5662e6646d2bb.png');background-size:300% 200%;background-repeat:no-repeat;background-position:0% 0%;animation:run-frames .65s step-end infinite;animation-play-state:paused}.scene.walking .runner{animation-play-state:running}.player{bottom:24px;line-height:1}.creatures .sprite{animation:creature-breathe 1.5s ease-in-out infinite;animation-play-state:paused;transform-origin:50% 100%}.creatures .sprite:nth-child(2){animation-delay:-.5s}.creatures .sprite:nth-child(3){animation-delay:-1s}.scene.walking .creatures .sprite{animation-play-state:running}@keyframes run-frames{0%{background-position:0% 0%}16.666%{background-position:50% 0%}33.333%{background-position:100% 0%}50%{background-position:0% 100%}66.666%{background-position:50% 100%}83.333%{background-position:100% 100%}100%{background-position:0% 0%}}@keyframes creature-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,1.07)}}@media(prefers-reduced-motion:reduce){.runner,.creatures .sprite{animation:none}}
.overlay{padding:12px;overflow:hidden;align-items:stretch}.overlay>div{margin:0;width:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}.overlay h2{flex:0 0 auto;margin:0;font-size:clamp(18px,5vw,23px);line-height:1.3}.overlay p{flex:0 1 auto;min-height:0;overflow-y:auto;margin:0;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.overlay .start{flex:0 0 auto;min-height:44px;padding:9px 12px;font-size:16px}@media(max-height:600px){.overlay{padding:10px}.overlay>div{gap:7px}.overlay p{font-size:13px;line-height:1.5}}
.creatures{overflow:visible;padding:4px 8px}.creatures .sprite{max-width:none;flex-shrink:0}
.creatures .sprite.ogre,.creatures .sprite.gargoyle,.creatures .sprite.reptile{background-image:url('./asset-8448d64dbd566395.png');background-size:300% 100%;background-repeat:no-repeat}.creatures .sprite.ogre{background-position:0% 50%}.creatures .sprite.gargoyle{background-position:50% 50%}.creatures .sprite.reptile{background-position:100% 50%}
#gate{display:none!important}

.creatures .sprite{position:relative;background-size:0 0!important;animation:none!important;overflow:visible}
.creatures .sprite i{position:absolute;inset:0;display:block;background-image:inherit;background-position:inherit;background-repeat:no-repeat;background-size:300% 300%;pointer-events:none}
.creatures .sprite.rabbit i{background-size:contain}
.creatures .sprite.ogre i,.creatures .sprite.gargoyle i,.creatures .sprite.reptile i{background-size:300% 100%}
.creatures .body-part{clip-path:inset(0 0 35% 0);animation:creature-body-step var(--stride,.65s) ease-in-out infinite}
.creatures .left-leg{clip-path:polygon(0 63%,50% 63%,50% 100%,0 100%);transform-origin:35% 63%;animation:creature-left-step var(--stride,.65s) ease-in-out infinite}
.creatures .right-leg{clip-path:polygon(50% 63%,100% 63%,100% 100%,50% 100%);transform-origin:65% 63%;animation:creature-right-step var(--stride,.65s) ease-in-out infinite}
.creatures .sprite i{animation-play-state:paused}.scene.walking .creatures .sprite i{animation-play-state:running}
@keyframes creature-left-step{0%,100%{transform:rotate(-7deg) translateY(-1px)}50%{transform:rotate(7deg) translateY(1px)}}
@keyframes creature-right-step{0%,100%{transform:rotate(7deg) translateY(1px)}50%{transform:rotate(-7deg) translateY(-1px)}}
@keyframes creature-body-step{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-1px)}}
@media(prefers-reduced-motion:reduce){.creatures .sprite i{animation:none}}
.runner{background-image:url('./asset-85f989f60867c692.png');background-size:300% 400%;animation-name:run-man}.runner.woman{animation-name:run-woman}
@keyframes run-man{0%,100%{background-position:0% 0%}16.666%{background-position:50% 0%}33.333%{background-position:100% 0%}50%{background-position:0% 33.333%}66.666%{background-position:50% 33.333%}83.333%{background-position:100% 33.333%}}
@keyframes run-woman{0%,100%{background-position:0% 66.666%}16.666%{background-position:50% 66.666%}33.333%{background-position:100% 66.666%}50%{background-position:0% 100%}66.666%{background-position:50% 100%}83.333%{background-position:100% 100%}}
</style></head><body><main><header><h1>三本道迷路</h1><button class="pause" id="pause" disabled>一時停止</button></header><div class="stats"><span>通過 <strong id="score">0</strong></span><span>レベル <strong id="level">1</strong></span><span>猶予 <strong id="time">4.0</strong>秒</span></div><div class="progress" aria-label="選択までの残り時間"><div id="bar"></div></div><section class="scene" id="scene" aria-label="上から流れる3本の道"><div class="road" id="road"></div><div class="shade"></div><div class="creatures" id="creatures"><span></span><span></span><span></span></div><div class="gate" id="gate"><div></div><div></div><div></div></div><div class="line"></div><div class="player" id="player" aria-label="走って進む人"><span class="runner" aria-hidden="true"></span></div><div class="overlay" id="overlay"><div><h2 id="title">通れる道を選ぼう</h2><p id="description">1・2・3で、動物のいる道へ移動しよう。<br>今いる道が動物なら、押さなくてもOK！<br>モンスターの道は危険！<br>動物とモンスターが奥から近づきます。<br>最初は3.2秒、進むほど速くなります。</p><button class="start" id="start" disabled>画像を読み込み中…</button></div></div></section><p class="hint" id="hint" role="status" aria-live="polite">動物のいる道を選ぼう</p><div class="keys" id="keys"></div><p class="meta">左が1・中央が2・右が3。選択は時間内なら変更できます。</p></main><script>
'use strict';const $=id=>document.getElementById(id),buttons=[];let mode='ready',score=0,elapsed=0,roundTime=0,selected=0,safe=1,last=0,raf=null,assetReady=false;
function difficulty(){const level=Math.floor(elapsed/15000)+1;return {level,duration:Math.max(1200,3200-(level-1)*300),hintStage:Math.min(4,Math.floor((level-1)/2))}}
function controls(){$('scene').classList.toggle('walking',mode==='playing');buttons.forEach(b=>b.disabled=mode!=='playing');$('pause').disabled=!['playing','paused'].includes(mode);$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function newRound(){safe=1+Math.floor(Math.random()*3);roundTime=0;buttons.forEach((b,i)=>b.classList.toggle('selected',i===selected-1));$('player').style.left=((selected-1)*100/3)+'%';$('gate').style.visibility='hidden';const d=difficulty(),animals=['dog','fox','rabbit'],monsters=['ogre','gargoyle','reptile'];Array.from($('creatures').children).forEach((icon,i)=>{const isSafe=i===safe-1;icon.innerHTML='<i class="body-part"></i><i class="leg-part left-leg"></i><i class="leg-part right-leg"></i>';icon.className='sprite '+(isSafe?animals[Math.floor(Math.random()*animals.length)]:monsters[Math.floor(Math.random()*monsters.length)]);icon.setAttribute('aria-label',isSafe?'動物・安全な道':'モンスター・危険な道')});$('hint').textContent='動物が近づく道を選ぼう';paint()}
function paint(){const d=difficulty(),ratio=Math.min(1,roundTime/d.duration),sceneHeight=$('scene').clientHeight;const creatures=$('creatures');creatures.style.fontSize=(16+12*ratio)+'px';creatures.style.visibility='visible';creatures.style.setProperty('--stride',Math.max(.24,.65*d.duration/3200)+'s');creatures.style.top=(sceneHeight*.08+ratio*Math.max(0,sceneHeight*.92-112))+'px';$('score').textContent=score;$('level').textContent=d.level;$('time').textContent=(Math.max(0,d.duration-roundTime)/1000).toFixed(1);$('bar').style.transform=`scaleX(${1-ratio})`;$('gate').style.transform=`translateY(${ratio*Math.max(0,sceneHeight-58)}px)`;$('road').style.setProperty('--scroll',(elapsed*(.065+(d.level-1)*.008)%1000)+'px')}
function stopLoop(){if(raf!==null)cancelAnimationFrame(raf);raf=null}
function finish(reason){if(mode!=='playing')return;mode='over';stopLoop();controls();$('title').textContent='迷路の挑戦終了';$('description').textContent=`${reason} ${score}本の道を通過しました。`;$('start').textContent='もう一度遊ぶ';$('overlay').hidden=false;if(window.parent!==window)window.parent.postMessage({type:'three-paths-result',score},'*')}
function choose(n){if(mode!=='playing'||!Number.isInteger(n)||n<1||n>3)return false;selected=n;buttons.forEach((b,i)=>b.classList.toggle('selected',i===n-1));$('player').style.left=((n-1)*100/3)+'%';return true}
function tick(now){raf=null;if(mode!=='playing')return;const dt=Math.min(100,Math.max(0,now-last));last=now;elapsed+=dt;roundTime+=dt;const d=difficulty();if(roundTime>=d.duration){if(selected!==safe){paint();finish('モンスターに出会いました。');return}score++;newRound()}paint();raf=requestAnimationFrame(tick)}
function start(){if(!assetReady)return;stopLoop();const runner=document.querySelector('.runner');const woman=Math.random()<.5;runner.classList.toggle('woman',woman);runner.setAttribute('aria-label',woman?'走る女性':'走る男性');mode='playing';selected=2;score=0;elapsed=0;last=performance.now();$('overlay').hidden=true;controls();newRound();raf=requestAnimationFrame(tick)}
function pause(){if(mode==='playing'){mode='paused';stopLoop();controls();$('title').textContent='ひとやすみ';$('description').textContent='準備ができたら続けましょう。';$('start').textContent='つづける';$('overlay').hidden=false}else if(mode==='paused'){mode='playing';last=performance.now();$('overlay').hidden=true;controls();raf=requestAnimationFrame(tick)}}
for(let n=1;n<=3;n++){const b=document.createElement('button');b.className='key';b.textContent=n;b.setAttribute('aria-label',`${n}の道を選ぶ`);b.onclick=()=>choose(n);$('keys').append(b);buttons.push(b)}$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(/^[1-3]$/.test(e.key)){e.preventDefault();choose(Number(e.key))}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='math-drop-pause'&&mode==='playing')pause()});const image=new Image();image.onload=()=>{$('road').style.backgroundImage='url("'+image.src+'")';assetReady=true;$('start').disabled=false;$('start').textContent='スタート'};image.onerror=()=>{$('start').textContent='画像を読み込めませんでした';$('description').textContent='暇つぶし一覧に戻り、もう一度開いてください。'};image.src='./asset-733bc8c17f4552aa.png';controls();
</script></body></html>
