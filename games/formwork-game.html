.stats{justify-content:flex-end}.stud:nth-child(2){left:calc(50% - 3px)}.foot-plate{transform:translateZ(2px) rotateZ(0deg)}.floor{width:280px;height:220px}</style><main class="app"><h1>型枠の組立て</h1><div class="stats"><span id="time">180秒</span></div><div id="steps" class="steps"></div><section class="guide"><h2 id="stageTitle"></h2><p id="instruction"></p></section><div class="site"><div class="floor"></div><span class="site-label">型枠施工エリア</span><div id="world" class="world"></div><div id="tools" class="tools"></div><div class="view"><button id="left">↶ 回転</button><span>点線の位置に貼り付け</span><button id="right">回転 ↷</button></div></div><p id="hint" class="hint"></p><div class="actions"><button id="result" hidden>次のレベルへ</button><button id="pause">一時停止</button></div><p class="note">遊び用に簡略化した工程です。</p></main><div id="overlay" class="overlay"><section class="box"><h2 id="title">順番を考えて型枠を組み立てよう</h2><p id="description">パネル→締め付け→補強→支えの順に取り付けます。順番が違う材料は取り付けできません。<br>材料の絵を選び、点線の位置に貼り付けます。回転して裏側にも取り付けよう。<br>全ての材料を取り付けたら「コンクリート」を押して注入。全て4面の箱です。次のレベルでは、小さい箱を上に重ねて2段にします。面が広くなると金具が横にも増えます。</p><button id="start">スタート</button></section></div><script>
'use strict';const $=id=>document.getElementById(id);const stages=[{name:'パネル',tool:'コンパネ',count:4,text:'点線の各面にパネルを立てよう。回転して裏側も組もう。'},{name:'締め付け',tool:'締め付け金具',count:4,text:'各面の金具を取り付けよう。'},{name:'補強',tool:'補強材',count:4,text:'各面に横向きの補強材を取り付けよう。'},{name:'支え',tool:'斜め支え',count:2,text:'周囲に斜めの支えを取り付けよう。'},{name:'流し込み',tool:'コンクリート',count:1,text:'材料の「コンクリート」を押すと注入します。'}];let level=1,faces=4,groups=1,tiers=2,panelHeight=120,layerHeight=120,baseWidth=100,columns=1;let mode='ready',stage=0,selected=false,done=[],angle=-30,remaining=180000,last=0,raf=null,pourProgress=0,pouring=false;const parts=[];let installed=stages.map(()=>[]),breakingTime=0;
function tierY(i){const d=tieSlot(i);return centerY(d.g)-height(d.g)/2+height(d.g)*.18+d.row*(height(d.g)*.64)/(tiers-1)}
function tieSlot(i){const g=Math.floor(i/(4*tiers)),n=i%(4*tiers);return {g,face:n%4,row:Math.floor(n/4)}}
function width(g){return baseWidth-g*24}
function height(g){return g===0?layerHeight:layerHeight/2}
function centerY(g){return panelHeight/2-(g===0?height(0)/2:height(0)+height(1)/2)}
function railFace(i){return Math.floor(i/(4*tiers))*4+i%4}
function railY(i){const g=Math.floor(i/(4*tiers)),row=Math.floor((i%(4*tiers))/4);return centerY(g)-height(g)/2+height(g)*.18+row*(height(g)*.64)/(tiers-1)}
function tieTransform(i,col=(columns-1)/2){const d=tieSlot(i),x=(col-(columns-1)/2)*width(d.g)/(columns+1);return transform(d.g*4+d.face,tierY(i),width(d.g)/2+11)+' translateX('+x+'px)'}
function brace(i){const g=Math.floor(i/2),side=i%2?1:-1,topX=side*(width(g)/2+7),bottomX=side*(baseWidth/2+75+g*20),topY=centerY(g)-height(g)/2+Math.min(18,height(g)*.2),bottomY=panelHeight/2,dx=bottomX-topX,dy=bottomY-topY;return {length:Math.hypot(dx,dy),transform:'translate(-50%,-50%) translateX('+((topX+bottomX)/2)+'px) translateY('+((topY+bottomY)/2)+'px) rotateZ('+(-Math.atan2(dx,dy)*180/Math.PI)+'deg)'}}


function faceIndex(i){const d=tieSlot(i);return d.g*4+d.face}

function groupX(){return 0}

function apothem(){return baseWidth/2}

function supportTransform(i){return brace(i).transform}

function createConcrete(){for(let g=0;g<groups;g++)for(let i=0;i<5;i++){const b=document.createElement('div');b.className='part concrete'+(i===4?' concrete-top':'');b.dataset.group=g;const w=width(g)-6;b.style.width=w+'px';b.style.height=(i===4?w:height(g))+'px';if(i<4)b.dataset.face=g*4+i;$('world').append(b)}paintConcrete()}

function paintConcrete(){$('world').querySelectorAll('.concrete').forEach(b=>{const g=Number(b.dataset.group),fill=Math.max(1,height(g)*pourProgress);if(b.classList.contains('concrete-top'))b.style.transform='translate(-50%,-50%) translateY('+(centerY(g)+height(g)/2-fill)+'px) rotateX(90deg)';else{b.style.height=fill+'px';b.style.transform=transform(Number(b.dataset.face),centerY(g)+height(g)/2-fill/2,width(g)/2-3)}})}

function commandImage(i){const drawings=['<path d="M8 23h32M24 7v32" stroke="#d15332" stroke-width="3"/><path d="M12 34l22-22" stroke="#3d6372" stroke-width="4"/>','<rect x="9" y="5" width="30" height="38" rx="1" fill="#cf9e5d" stroke="#79552c" stroke-width="2"/><path d="M15 8v32m8-32v32m8-32v32" stroke="#ab7b3d"/>','<path d="M7 24h34" stroke="#788d97" stroke-width="7"/><circle cx="24" cy="24" r="9" fill="#ccd6db" stroke="#4d616b" stroke-width="3"/><path d="M18 24h12m-6-6v12" stroke="#4d616b" stroke-width="3"/>','<rect x="5" y="16" width="38" height="15" fill="#81949f" stroke="#445b67" stroke-width="2"/><path d="M8 20h32" stroke="#d6e1e5" stroke-width="3"/>','<path d="M11 39L34 8" stroke="#6a8290" stroke-width="8"/><path d="M11 39L34 8" stroke="#c6d2d8" stroke-width="3"/>','<rect x="10" y="5" width="29" height="38" rx="3" fill="#eef4ed" stroke="#527261" stroke-width="2"/><path d="M16 24l6 6 12-14" fill="none" stroke="#2d8a52" stroke-width="4"/>','<path d="M9 12h26l6 22H15z" fill="#a3aaa4" stroke="#586c64" stroke-width="2"/><path d="M17 9v28m7-28v28m7-28v28" stroke="#d0d7d1"/><path d="M6 7h16" stroke="#667d86" stroke-width="6"/>'];return '<svg viewBox="0 0 48 48" role="img" aria-label="'+stages[i].tool+'">'+drawings[i===4?6:i+1]+'</svg>'}
function outline(){for(let i=0;i<4*groups;i++){const b=document.createElement('div');b.className='part outline';b.style.width=width(Math.floor(i/4))+'px';b.style.height=height(Math.floor(i/4))+'px';b.style.transform=transform(i);$('world').append(b)}}

function transform(face,y,z){const g=Math.floor(face/4);return 'translate(-50%,-50%) rotateY('+(face%4)*90+'deg) translateZ('+(z===undefined?width(g)/2:z)+'px) translateY('+(y===undefined?centerY(g):y)+'px)'}

function rotate(){const site=$('world').parentElement;const scale=Math.min(1,Math.max(.1,(site.clientHeight-90)/(panelHeight+64)),Math.max(.1,(site.clientWidth-58)/(baseWidth+190)));$('world').style.transform='scale('+scale+') rotateX(-14deg) rotateY('+angle+'deg)';site.querySelector('.floor').style.top=(site.clientHeight*.44+panelHeight*.5*scale)+'px'}
function part(type,i){const b=document.createElement('div');b.className='part '+type;b.setAttribute('aria-hidden','true');if(type==='panel-part'){b.style.width=width(Math.floor(i/4))+'px';b.style.height=height(Math.floor(i/4))+'px';b.style.transform=transform(i);b.innerHTML='<i class="stud"></i><i class="stud"></i><i class="stud"></i><i class="ply-edge"></i>';}else if(type==='tie-part'){b.style.width='21px';b.style.height='21px';b.style.transform=tieTransform(i,0);b.innerHTML='<i class="nut"></i>'}else if(type==='rail'){b.style.width=(width(Math.floor(i/(4*tiers)))+4)+'px';b.style.height='18px';b.style.transform=transform(railFace(i),railY(i),width(Math.floor(i/(4*tiers)))/2+8)}else{b.style.width='12px';b.style.height=brace(i).length+'px';b.style.transform=supportTransform(i);}if(type==='support-part')b.innerHTML='<i class="brace-pin"></i><i class="foot-plate"></i>';if(type==='tie-part')for(let c=1;c<columns;c++){const extra=document.createElement('div');extra.className='part tie-part';extra.setAttribute('aria-hidden','true');extra.style.width='21px';extra.style.height='21px';extra.style.transform=tieTransform(i,c);extra.innerHTML='<i class="nut"></i>';parts.push(extra);$('world').append(extra)}parts.push(b);$('world').append(b)}
function render(){const s=stages[stage];done=installed[stage];$('steps').replaceChildren();stages.forEach((x,i)=>{const b=document.createElement('span');b.textContent=x.name;b.className=i===stage?'active':installed[i].filter(Boolean).length===x.count?'done':'';$('steps').append(b)});$('stageTitle').textContent='レベル '+level+'：'+s.name;$('instruction').textContent=stage===1||stage===2?s.text+' '+groups+'段重ね／締め材'+tiers+'段'+(stage===1?'・横'+columns+'列を一括取付け':'')+'。':s.text;$('tools').replaceChildren();stages.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=commandImage(i)+'<span>'+x.tool+'</span>';b.setAttribute('aria-label',x.tool);b.disabled=mode!=='playing'||pouring;b.className=i===stage&&selected?'selected':'';b.onclick=()=>{if(mode!=='playing'||pouring)return;stage=i;selected=true;if(stage===4){done=installed[stage];place(0);return}render();$('hint').textContent='点線の場所に貼り付けよう。'};$('tools').append(b)});$('world').querySelectorAll('.target').forEach(x=>x.remove());for(let i=0;i<(stage===4?0:s.count);i++){const b=document.createElement('button');b.className='target'+(stage===1||stage===2?' tier-target':'')+(done[i]?' placed':'');b.textContent=stage===4?'注入':'';b.setAttribute('aria-label',stages[stage].tool+'を取り付ける');b.disabled=!!done[i];if(stage===0){b.style.width=width(Math.floor(i/4))+'px';b.style.height=height(Math.floor(i/4))+'px';}if(stage<3)b.style.transform=stage===0?transform(i):stage===1?tieTransform(i):transform(railFace(i),railY(i),width(Math.floor(i/(4*tiers)))/2+15);else if(stage===3)b.style.transform='translate(-50%,-50%) translateX('+(i?90:-90)+'px) translateY(45px) translateZ(70px)';else b.style.transform='translate(-50%,-50%) translateZ(95px)';if(stage===1)b.className+=' tie-outline';if(stage===2){b.className+=' rail-outline';b.style.width=(width(Math.floor(i/(4*tiers)))+4)+'px';}if(stage===3){b.className+=' support-outline';b.style.width='16px';b.style.height=brace(i).length+'px';b.style.transform=supportTransform(i);}b.onclick=()=>place(i);$('world').append(b)}rotate()}
function place(i){if(mode!=='playing'||pouring||done[i])return;advance(performance.now());if(mode!=='playing')return;if(!selected){$('hint').textContent='先に「'+stages[stage].tool+'」を選んでください。';return}if(stage===4){if(!complete()){collapse();return}createConcrete();pourProgress=1;paintConcrete();done[0]=true;mode='completed';stop();render();update();$('hint').textContent='注入完了！ 回転して確認し、次のレベルへ進めます。';$('result').hidden=false;$('pause').hidden=true;return;$('hint').textContent='コンクリートを流し込んでいます…';return}const expected=stages.slice(0,4).findIndex((s,j)=>installed[j].filter(Boolean).length!==s.count);if(expected!==-1&&stage!==expected){update();$('hint').textContent='順番が違います。先に「'+stages[expected].name+'」を完成させてください。';return}done[i]=true;if(stage===0)part('panel-part',i);if(stage===1)part('tie-part',i);if(stage===2)part('rail',i);if(stage===3)part('support-part',i);render();$('hint').textContent=done.filter(Boolean).length===stages[stage].count?'設置完了！ 別の材料を選べます。':'設置しました。残りの場所にも取り付けよう。';update()}
function update(){$('time').textContent='残り '+Math.ceil(remaining/1000)+'秒'}
function stop(){if(raf!==null)cancelAnimationFrame(raf);raf=null}
function advance(now){if(mode!=='playing')return;remaining=Math.max(0,remaining-Math.max(0,now-last));last=now;update();if(!remaining)finish(false)}
function tick(now){raf=null;const dt=Math.max(0,now-last);if(mode==='breaking'){last=now;breakingTime+=dt;if(breakingTime>=1400)finish(false);else raf=requestAnimationFrame(tick);return}advance(now);if(mode==='playing'&&pouring){pourProgress=Math.min(1,pourProgress+dt/4000);paintConcrete();if(pourProgress===1){pouring=false;done[0]=true;finish(true);return}}if(mode==='playing')raf=requestAnimationFrame(tick)}

function finish(success){if(!['playing','breaking','completed'].includes(mode))return;const broken=mode==='breaking';mode='over';stop();update();$('title').textContent=success?'コンクリートの流し込み完了！':broken?'型枠が壊れました':'時間切れ';$('description').textContent=(success?'型枠を組み、コンクリートを流し込みました。':broken?'未完成で注入したため、型枠が壊れました。':'時間内に完成できませんでした。');$('start').textContent='もう一度組み立てる';$('overlay').hidden=false;}
function complete(){return stages.slice(0,4).every((s,i)=>installed[i].filter(Boolean).length===s.count)}
function collapse(){mode='breaking';breakingTime=0;createConcrete();pourProgress=.35;paintConcrete();$('world').querySelectorAll('.target').forEach(x=>x.remove());parts.forEach((p,i)=>{p.style.transition='transform 1s ease-in, opacity 1s';p.style.transform+=' translateY(90px) translateX('+((i%2?1:-1)*90)+'px) rotateZ('+((i%2?1:-1)*45)+'deg)';p.style.opacity='.4'});$('hint').textContent='未完成の型枠が壊れ、コンクリートが漏れました！';}

function start(){stop();mode='playing';$('result').hidden=true;$('pause').hidden=false;pouring=false;pourProgress=0;faces=4;groups=level===1?1:2;tiers=level<4?2:3;baseWidth=level<3?100:level<5?140:180;layerHeight=120;panelHeight=groups===1?layerHeight:layerHeight*1.5;columns=baseWidth<170?2:3;stages[0].count=4*groups;stages[1].count=tiers*4*groups;stages[2].count=tiers*4*groups;stages[3].count=2*groups;stage=0;selected=false;installed=stages.map(()=>[]);done=installed[0];breakingTime=0;parts.length=0;$('world').replaceChildren();outline();angle=-30;remaining=180000+60000*(groups-1)+30000*(faces-4)/2;last=performance.now();$('overlay').hidden=true;$('hint').textContent='取り付けたい材料の絵を選ぼう。';render();update();raf=requestAnimationFrame(tick)}
function pause(){if(mode==='playing'){advance(performance.now());if(mode!=='playing')return;mode='paused';stop();$('title').textContent='ひとやすみ';$('description').textContent='準備ができたら続けましょう。';$('start').textContent='つづける';$('overlay').hidden=false}else if(mode==='paused'){mode='playing';last=performance.now();$('overlay').hidden=true;render();raf=requestAnimationFrame(tick)}}
window.addEventListener('resize',rotate);$('left').onclick=()=>{angle-=90;rotate()};$('right').onclick=()=>{angle+=90;rotate()};$('pause').onclick=pause;$('result').onclick=()=>{if(mode==='completed'){level++;start()}};$('start').onclick=()=>mode==='paused'?pause():start();document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='math-drop-pause'&&mode==='playing')pause()});render();update();
</script></html>
