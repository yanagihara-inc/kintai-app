<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数字もぐら</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2a;color:#f5f8ff;font-family:system-ui,sans-serif}main{max-width:480px;margin:auto;padding:16px 18px max(16px,env(safe-area-inset-bottom))}h1{font-size:23px;margin:0}header,.stats{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{margin:16px 0;font-variant-numeric:tabular-nums}.stats strong{font-size:25px}.stats small{display:block;color:#b2c5d9;font-size:13px}.time{color:#ffd36f}.time.low{color:#ff8d96}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #ffcf62;outline-offset:3px}.secondary{background:#263b54;color:white;border:1px solid #527092;border-radius:10px;padding:10px 12px;min-height:44px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#1b3041;padding:15px;border-radius:20px;border:1px solid #3a5368}.hole{height:clamp(55px,12svh,90px);border-radius:50%;background:#09131e;box-shadow:inset 0 6px 10px #0008;overflow:hidden;display:grid;place-items:center}.number{display:grid;place-items:center;width:72%;height:85%;border-radius:20px 20px 40% 40%;background:#ffd36f;color:#152338;font-weight:850;font-size:clamp(27px,7vw,40px);transform:translateY(120%);transition:transform .1s;visibility:hidden}.hole.active .number{transform:translateY(0);visibility:visible}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{min-height:48px;border:1px solid #49647e;border-bottom:4px solid #071421;background:#29415b;color:#fff;border-radius:12px;font-size:27px;font-weight:bold}.key:active{background:#456789}.key:disabled{opacity:.4}#feedback{min-height:24px;font-size:14px;text-align:center;color:#bfeada;margin:10px 0}.panel{margin:12px 0;padding:20px;background:#233950;border:1px solid #49647e;border-radius:16px}.panel[hidden]{display:none}.panel h2{margin:0 0 10px;font-size:22px}.panel p{font-size:16px;line-height:1.7;color:#d6e2ef;margin:0 0 16px}.primary{width:100%;min-height:48px;padding:12px;background:#ffd36f;border:0;border-radius:12px;color:#152338;font-size:18px;font-weight:bold}.caption{font-size:13px;color:#b2c5d9;text-align:center;margin:12px 0 0}@media(prefers-reduced-motion:reduce){.number{transition:none}}
</style></head><body><main><header><h1>数字もぐら</h1><button id="pause" class="secondary" disabled>一時停止</button></header><div class="stats"><div><small>成功</small><strong id="score">0</strong></div><div><small>レベル</small><strong id="level">1</strong></div><div class="time" id="timer"><small>残り時間</small><strong id="time">20.0</strong><span> 秒</span></div></div><section id="panel" class="panel"><h2 id="title">数字を見つけてタップ！</h2><p id="description">9個の穴から現れる数字と同じボタンを押そう。成功すると残り時間が1秒延長！<br>5回成功するごとに速くなるよ。時間切れで終了。</p><button id="start" class="primary">スタート</button></section><div id="board" class="board" role="group" aria-label="数字が出現する9個の穴"></div><p id="feedback" role="status" aria-live="polite">下の数字ボタンでたたこう</p><div id="keys" class="keys" aria-label="数字のボタン"></div><p class="caption">最初は20秒・成功で＋1秒・時間切れで終了</p></main><script>
'use strict';
const $=id=>document.getElementById(id),holes=[],buttons=[];let mode='ready',score=0,remaining=20000,last=0,nextSpawn=0,raf=null;const active=new Map();
function difficulty(){const level=Math.floor(score/5)+1;return {level,interval:Math.max(280,1250-(level-1)*110),stay:Math.max(430,1900-(level-1)*150)}}
function controls(){buttons.forEach(b=>b.disabled=mode!=='playing');$('pause').disabled=!['playing','paused'].includes(mode);$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function render(){$('score').textContent=score;$('level').textContent=difficulty().level;$('time').textContent=(Math.max(0,remaining)/1000).toFixed(1);$('timer').classList.toggle('low',remaining<=5000)}
function clearHole(index){active.delete(index);holes[index].classList.remove('active');holes[index].setAttribute('aria-label','空の穴');holes[index].firstChild.textContent=''}
function spawn(now){const free=holes.map((_,i)=>i).filter(i=>!active.has(i)),used=new Set([...active.values()].map(m=>m.number)),numbers=Array.from({length:9},(_,i)=>i+1).filter(n=>!used.has(n));if(!free.length||!numbers.length)return;const index=free[Math.floor(Math.random()*free.length)],number=numbers[Math.floor(Math.random()*numbers.length)];active.set(index,{number,expires:now+difficulty().stay});holes[index].firstChild.textContent=number;holes[index].classList.add('active');holes[index].setAttribute('aria-label',`数字 ${number}`)}
function finish(){if(mode!=='playing')return;mode='over';remaining=0;if(raf!==null)cancelAnimationFrame(raf);raf=null;active.forEach((_,i)=>clearHole(i));render();controls();$('title').textContent='タイムアップ！';$('description').textContent=`${score}回成功！ レベル${difficulty().level}まで到達。`;$('start').textContent='もう一度遊ぶ';$('panel').hidden=false;$('feedback').textContent='おつかれさま！';if(window.parent!==window)window.parent.postMessage({type:'number-mole-result',score},'*')}
function advance(now){remaining-=Math.max(0,now-last);last=now;if(remaining<=0){finish();return false}for(const [i,m] of active)if(now>=m.expires)clearHole(i);return true}
function tick(now){raf=null;if(mode!=='playing')return;if(!advance(now))return;if(now>=nextSpawn){spawn(now);nextSpawn=now+difficulty().interval}render();raf=requestAnimationFrame(tick)}
function start(){if(raf!==null)cancelAnimationFrame(raf);active.forEach((_,i)=>clearHole(i));mode='playing';score=0;remaining=20000;last=performance.now();spawn(last);nextSpawn=last+difficulty().interval;$('panel').hidden=true;$('feedback').textContent='現れた数字と同じボタンをタップ！';render();controls();raf=requestAnimationFrame(tick)}
function hit(n){if(mode!=='playing')return false;const now=performance.now();if(!advance(now))return false;const entry=[...active].find(([,m])=>m.number===n);if(!entry){$('feedback').textContent=`${n}は出ていないよ`;render();return false}clearHole(entry[0]);score++;remaining+=1000;$('feedback').textContent=score%5===0?'レベルアップ！ 出現と退避がスピードアップ':'成功！ ＋1秒';nextSpawn=Math.min(nextSpawn,now+difficulty().interval);render();return true}
function pause(){if(mode==='playing'){const now=performance.now();if(!advance(now))return false;mode='paused';if(raf!==null)cancelAnimationFrame(raf);raf=null;$('panel').hidden=false;$('title').textContent='ひとやすみ';$('description').textContent='残り時間は止まっています。';$('start').textContent='つづける';controls();return true}if(mode==='paused'){const now=performance.now(),gap=now-last;active.forEach(m=>m.expires+=gap);nextSpawn+=gap;last=now;mode='playing';$('panel').hidden=true;controls();raf=requestAnimationFrame(tick)}return true}
for(let i=0;i<9;i++){const hole=document.createElement('div');hole.className='hole';hole.setAttribute('aria-label','空の穴');const number=document.createElement('span');number.className='number';hole.append(number);$('board').append(hole);holes.push(hole);const b=document.createElement('button');b.className='key';b.textContent=i+1;b.setAttribute('aria-label',`数字 ${i+1}をたたく`);b.onclick=()=>hit(i+1);$('keys').append(b);buttons.push(b)}
$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;if(/^[1-9]$/.test(e.key)){e.preventDefault();hit(Number(e.key))}if(e.key==='Escape'&&mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='math-drop-pause'&&mode==='playing')pause()});controls();render();
</script></body></html>
